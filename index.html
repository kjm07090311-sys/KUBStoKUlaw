<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f6" id="metaTheme">
<script>/* 화면 모드: 첫 화면 깜빡임 막으려고 head에서 먼저 적용 */
function themePref(){ try{ return localStorage.getItem('kugrad3:theme') || 'auto'; }catch(e){ return 'auto'; } }
function applyTheme(){ const p = themePref(), dark = p==='dark' || (p==='auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.getElementById('metaTheme'); if(m) m.setAttribute('content', dark ? '#0f1012' : '#f2f4f6'); }
applyTheme();
try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){}
</script>
<meta name="description" content="고려대학교 26학번 경영학과 졸업요건 트래커 — 이중·융합·심화전공, LEET 기록">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<title>고경에서 고로까지</title>
<style>

:root{--bg:#f2f4f6;--card:#fff;--ink:#191f28;--sub:#4e5968;--mut:#8b95a1;--faint:#b0b8c1;--line:#eef0f3;--track:#eef0f3;
  --brand:#8B0029;--brand-soft:#fbeef2;--ok:#1b9c5a;--ok-soft:#e8f7ef;--ing:#e08a00;--ing-soft:#fff4e0;--blue:#3182f6;--blue-soft:#e8f3ff;
  --soft:#f2f4f6;--soft2:#f9fafb;--line2:#e5e8eb;--bd:#d1d6db;--seg:#e9ecef;--blue-ink:#1b64da;--blue-soft2:#f5f9ff;--warn-bg:#fdecec;--warn-ink:#c0392b;
  --ing-ink:#8a5600;--ing-bar:#f2b8c6;--navbg:rgba(242,244,246,.92);--on-ink:#fff;color-scheme:light}
/* ── 다크모드 (2026-11): 설정에서 자동/라이트/다크, 자동이면 기기 설정 따라감 ── */
:root[data-theme="dark"]{--bg:#0f1012;--card:#1b1c20;--ink:#eceef1;--sub:#b3b9c2;--mut:#8a919b;--faint:#5e646d;--line:#2a2c31;--track:#2c2e34;
  --brand:#d0345f;--brand-soft:#3a1621;--ok:#34c47c;--ok-soft:#14321f;--ing:#f2a33a;--ing-soft:#3a2a12;--blue:#4c93ff;--blue-soft:#172640;
  --soft:#25272c;--soft2:#202226;--line2:#31333a;--bd:#474a52;--seg:#25272c;--blue-ink:#86b6ff;--blue-soft2:#151e2c;--warn-bg:#3b1a1c;--warn-ink:#ff8d8d;
  --ing-ink:#f2b866;--ing-bar:#7a3a4d;--navbg:rgba(15,16,18,.86);--on-ink:#fff;color-scheme:dark}
:root[data-theme="dark"] .box, :root[data-theme="dark"] .sheet{box-shadow:none}
:root[data-theme="dark"] .fab{box-shadow:0 8px 24px rgba(0,0,0,.5)}
:root[data-theme="dark"] .nav-in img, :root[data-theme="dark"] .g-logo{background:#8B0029}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button{font:inherit;cursor:pointer}

/* ── 상단 바 ── */
.nav{position:sticky;top:0;z-index:20;background:var(--navbg);backdrop-filter:saturate(1.6) blur(12px);-webkit-backdrop-filter:saturate(1.6) blur(12px);padding-top:env(safe-area-inset-top)}
.nav-in{max-width:1200px;margin:0 auto;height:56px;padding:0 16px;display:flex;align-items:center;gap:10px}
.nav-in img{width:28px;height:28px;border-radius:8px;background:var(--brand);padding:3px;object-fit:contain}
.nav-in b{font-size:17px;font-weight:700}
.nav-in .who{font-size:12.5px;color:var(--mut);font-weight:500}
.nav-in .sp{flex:1}
.nav-in .ic{width:40px;height:40px;border:none;background:none;border-radius:12px;color:var(--sub);display:flex;align-items:center;justify-content:center}
.nav-in .ic:hover{background:var(--line2)}
.nav-in .ic svg{width:22px;height:22px}
.nav-in .addd{display:none;border:none;background:var(--brand);color:#fff;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px}
.sync{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mut)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

/* ── 레이아웃: 모바일 1열 ── */
.page{max-width:560px;margin:0 auto;padding:4px 16px 120px}
.colL,.colR{display:contents}
@media (max-width:1023px){.page{display:flex;flex-direction:column}.hero{order:1}.colL>.box:nth-child(2){order:2}.seg{order:3}#box1,#box2,#boxT{order:4}#boxS{order:6}}
.box{background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:12px}
.box h2{margin:0 0 14px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.box h2 .sp{flex:1}
.box h2 small{font-size:13px;color:var(--mut);font-weight:500}
.box h2 .tag{font-size:12px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 8px;border-radius:7px}

.hero{padding:18px 4px 22px}
.hero .k{font-size:15px;color:var(--sub);font-weight:600}
.hero h1{margin:6px 0 0;font-size:28px;line-height:1.35;font-weight:700;letter-spacing:-.8px}
.hero h1 em{font-style:normal;color:var(--brand)}
.big-pb{height:10px;background:var(--line2);border-radius:99px;margin-top:18px;overflow:hidden;display:flex}
.big-pb i{display:block;height:100%;background:var(--brand)}
.big-pb i.ing{background:var(--ing-bar)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin-top:9px}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--brand);vertical-align:1px}
.legend span.ing::before{background:var(--ing-bar)}

.nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.nums small{display:block;font-size:12.5px;color:var(--mut);margin-bottom:5px}
.nums b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.nums em{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:3px}

.seg{display:flex;background:var(--seg);border-radius:13px;padding:4px;margin:6px 0 12px}
.seg button{flex:1;border:none;background:none;font-size:14px;font-weight:600;color:var(--mut);padding:10px 4px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
/* 모바일: 선택한 탭만 보이기 */
body[data-seg="1"] #box2, body[data-seg="1"] #boxT,
body[data-seg="2"] #box1, body[data-seg="2"] #boxT,
body[data-seg="3"] #box1, body[data-seg="3"] #box2{display:none}

.row{display:flex;align-items:center;gap:12px;padding:13px 0;cursor:pointer}
.row + .row, .detail + .row{border-top:1px solid var(--line)}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:none}
.row.done .ic{background:var(--ok-soft);color:var(--ok)}
.row .m{flex:1;min-width:0}
.row .m b{display:block;font-size:15.5px;font-weight:600}
.row .m small{display:block;font-size:13px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m .pb{height:4px;background:var(--track);border-radius:99px;margin-top:8px;overflow:hidden}
.row .m .pb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.row.done .m .pb i{background:var(--ok)}
.row .r{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;min-width:36px}
.row .r small{display:block;font-size:12px;color:var(--faint);font-weight:500}
.row.done .r{color:var(--ok)}
.detail{display:none;padding:0 0 12px 52px}
.detail.on{display:block}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:13px;padding:6px 10px;border-radius:9px;background:var(--soft);color:var(--sub)}
.tags span.y{background:var(--ok-soft);color:var(--ok);font-weight:600}
.tags span.i{background:var(--ing-soft);color:var(--ing);font-weight:600}
.dualline{font-size:13px;color:var(--sub);background:var(--soft2);border-radius:12px;padding:12px 14px;margin-top:8px;line-height:1.55}
.dualline b{color:var(--ink)}
.none2{text-align:center;padding:26px 8px;color:var(--mut);font-size:14px;line-height:1.6}
.none2 b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* 수강 내역 아코디언 */
.need .grp{margin-bottom:12px}
.need .grp small{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:7px}
.need .tags span{cursor:pointer}
.alltog{font-size:13px;color:var(--blue);font-weight:600;cursor:pointer}
.sems{display:block}
.sem + .sem{border-top:1px solid var(--line)}
.sem .h{display:flex;align-items:center;gap:8px;padding:16px 0;cursor:pointer;user-select:none;-webkit-user-select:none}
.sem .h b{font-size:16px}
.sem .h small{color:var(--mut);font-size:13px}
.sem .h .sp{flex:1}
.sem .h .g{font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums;font-size:15px}
.sem .h .ingb{font-size:12px;font-weight:700;color:var(--ing);background:var(--ing-soft);padding:3px 8px;border-radius:7px}
.sem .h .chev{width:20px;height:20px;color:var(--faint);transition:transform .2s;flex:none}
.sem.open .h .chev{transform:rotate(180deg)}
.sem .body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.sem.open .body{grid-template-rows:1fr}
.sem .body>div{overflow:hidden}
.sem .peek{font-size:12.5px;color:var(--faint);margin:-10px 0 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sem.open .peek{display:none}
.co{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px}
.co .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co .n small{display:block;font-size:12px;color:var(--mut);margin-top:2px}
.co .gr{font-weight:700;font-variant-numeric:tabular-nums}
.co .gr.ing{color:var(--ing);font-size:13px}
.addc{display:block;width:100%;margin:6px 0 16px;border:none;background:var(--soft);border-radius:12px;padding:12px;font-size:14px;font-weight:600;color:var(--sub)}
.kpi2{margin:-4px 0 10px}
.kpi2 b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.6px}
.kpi2 b i{font-style:normal;font-size:14px;color:var(--faint);font-weight:500;margin-left:2px}
.kpi2 span{display:block;font-size:13px;color:var(--mut);margin-top:2px}
.mini-seg{display:flex;background:var(--soft);border-radius:9px;padding:3px}
.mini-seg button{border:none;background:none;font-size:12.5px;font-weight:600;color:var(--mut);padding:5px 10px;border-radius:7px}
.mini-seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.lg{display:flex;gap:14px;font-size:12.5px;color:var(--sub);margin-bottom:4px}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{display:inline-block;width:16px;height:2px;border-radius:2px}
.lg i.dash,.tip i.dash{height:0;border-top:2px dashed currentColor;background:none}
.chart{position:relative;touch-action:pan-y}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gl.base{stroke:var(--bd)}
.chart .ax{font-size:11.5px;fill:var(--mut);font-variant-numeric:tabular-nums}
.chart .dl{font-size:13px;font-weight:700;fill:var(--ink);font-variant-numeric:tabular-nums}
.chart .dl.mut{fill:var(--sub);font-weight:600}
.chart .xh{stroke:var(--faint);stroke-width:1}
.chart .bar{transition:opacity .12s}
.chart .bar.hi{opacity:.8}
.tip{display:none;position:absolute;top:0;background:var(--card);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:10px 12px;pointer-events:none;min-width:150px;font-size:12.5px}
.tip .th{font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
.tip .tr2{display:flex;align-items:center;gap:7px;padding:2px 0}
.tip .tr2 i{width:12px;height:2px;border-radius:2px;flex:none}
.tip .tr2 b{font-size:14px;font-variant-numeric:tabular-nums;min-width:42px}
.tip .tr2 span{color:var(--mut)}
.demo{font-size:12px;color:var(--faint);margin:8px 0 0}
details.tbl{margin-top:10px}
details.tbl summary{font-size:13px;color:var(--blue);font-weight:600;cursor:pointer;list-style:none}
details.tbl table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
details.tbl th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
details.tbl td{text-align:right;padding:7px 4px;border-bottom:1px solid var(--line)}
details.tbl th:first-child,details.tbl td:first-child{text-align:left}
.trend .tr{display:flex;align-items:center;gap:12px;padding:10px 0}
.trend .tr b{width:92px;font-size:14px;font-weight:600}
.trend .tr .pb{flex:1;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.trend .tr .pb i{display:block;height:100%;background:var(--brand);border-radius:99px}
.trend .tr span{font-weight:700;font-variant-numeric:tabular-nums;width:40px;text-align:right}
.trend p{font-size:13px;color:var(--mut);margin:10px 0 0}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));width:calc(100% - 32px);max-width:528px;border:none;border-radius:16px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;padding:17px;box-shadow:0 8px 24px rgba(139,0,41,.28);z-index:15}

/* ── 데스크톱: 3단 대시보드 ── */
@media (min-width:1024px){
  .nav-in{padding:0 28px}
  .nav-in .addd{display:block}
  .page{max-width:1200px;padding:8px 28px 60px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
  .colL{display:block;position:sticky;top:72px}
  .colR{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-content:start}
  .colR .box{margin:0}
  .seg,.fab{display:none}
  body[data-seg] #box1, body[data-seg] #box2{display:block!important}
  #boxT{display:none!important}
  .colL #boxT2{display:block}
  #boxS{grid-column:1/-1}
  .hero{background:var(--card);border-radius:22px;padding:24px 22px;margin-bottom:12px}
  .hero h1{font-size:25px}
  .sems{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;align-items:start}
  .sem + .sem{border-top:none}
  .sem{border-bottom:1px solid var(--line)}
  body.solo .colR{grid-template-columns:1fr}
}
#boxT2{display:none}
/* ── 졸업/LEET 전환 ── */
.mode-sw{display:none;background:var(--line2);border-radius:10px;padding:3px;margin-left:4px}
body.leet-on .mode-sw{display:flex}
.mode-sw button{border:none;background:none;font-size:13px;font-weight:700;color:var(--mut);padding:6px 11px;border-radius:8px}
.mode-sw button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
#lpage{display:none}
body.m-leet #gpage{display:none!important}
body.m-leet #lpage{display:block}
@media (min-width:1024px){ body.m-leet #lpage{display:grid} }
body.m-leet .fab.g, body:not(.m-leet) .fab.l{display:none}
.lhero{padding:18px 4px 18px}
.lhero .k{font-size:14px;color:var(--sub);font-weight:600}
.lhero h1{margin:6px 0 16px;font-size:34px;font-weight:700;letter-spacing:-1px}
.lhero h1 em{font-style:normal;color:var(--brand)}
.lhero h1 .u{font-size:16px;color:var(--mut);font-weight:600;letter-spacing:0}
.nums3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border-radius:18px;padding:16px 18px}
.nums3 small{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px}
.nums3 b{font-size:20px;font-variant-numeric:tabular-nums}
@media (min-width:1024px){.lhero{background:var(--card);border-radius:22px;padding:24px 22px;margin-bottom:12px}.nums3{padding:14px 0 0;border-top:1px solid var(--line);border-radius:0}}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 12px}
.mini-seg.wide{display:flex;margin-bottom:14px}
.mini-seg.wide button{flex:1;padding:9px}
.rk{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--sub);margin-bottom:10px}
.rk span{display:flex;align-items:center;gap:6px}
.rk i{width:12px;height:3px;border-radius:2px;display:inline-block}
.rk b{color:var(--ink);font-variant-numeric:tabular-nums}
.rk em{font-style:normal;font-weight:700;font-size:12px}
.rk em.up{color:var(--ok)} .rk em.dn{color:#e5484d}
.lg{flex-wrap:wrap}
.lg i{height:3px!important}
.lempty{padding:40px 0;text-align:center;color:var(--faint)}
.lrec{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.lrec .m{flex:1;min-width:0}
.lrec .m b{display:block;font-size:15px;font-weight:600}
.lrec .m small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.lrec .r{text-align:right;font-variant-numeric:tabular-nums}
.lrec .r b{font-size:16px}
.lrec .r small{display:block;font-size:12px;color:var(--faint)}
.frow{display:flex;gap:10px;margin-bottom:10px}
.frow label,.dt{flex:1;display:block;font-size:12.5px;color:var(--mut);font-weight:600}
.frow label em{font-style:normal;color:var(--faint);font-weight:500}
.frow input,.frow select,.dt input,.ftab input{display:block;width:100%;margin-top:5px;font:inherit;font-size:16px;padding:11px 12px;border:none;border-radius:11px;background:var(--soft);color:var(--ink)}
.dt{margin:10px 0 0}
.ftab{width:100%;border-collapse:collapse;margin-bottom:8px}
.ftab th{font-size:12px;color:var(--mut);font-weight:600;padding:0 3px 4px;text-align:left}
.ftab td{padding:3px}
.ftab td:first-child{font-size:13.5px;font-weight:600;width:40px}
.ftab input{margin:0;padding:10px}
.pv{background:var(--soft2);border-radius:12px;padding:12px 14px;font-size:13px}
.pv.muted,.pv .muted{color:var(--mut);line-height:1.5}
.pvg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pvg small{display:block;font-size:12px;color:var(--mut)}
.pvg b{font-size:20px;font-variant-numeric:tabular-nums}
.pvg em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:1px}
.savebtn{width:100%;margin-top:14px;border:none;border-radius:13px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;padding:14px}
/* 입력 폼: 폰=바텀시트, 컴퓨터=왼쪽 칸 */
@media (max-width:1023px){
  #lform{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:560px;margin:0 auto;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-height:90vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
  body.lf-open #lform{transform:none}
  #lfbg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;display:none}
  body.lf-open #lfbg{display:block}

   고경에서 고로까지 v3 — 핵심 로직

   · 과목 단위 중복인정 배정 (전공별 한도·조건)
   ═══════════════════════════════════════════════════════════════ */
const APP_V = 3;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => { n = Math.round(n*10)/10; return Number.isInteger(n) ? String(n) : n.toFixed(1); };
const pct = (a,b) => b ? Math.min(100, a/b*100) : 0;
const g2 = v => v==null ? '–' : v.toFixed(2);
const up = s => String(s||'').trim().toUpperCase().replace(/\s+/g,'');

/* ── 성적 ── */
const GRADES = {"A+":4.5,"A0":4.0,"B+":3.5,"B0":3.0,"C+":2.5,"C0":2.0,"D+":1.5,"D0":1.0,"F":0,"P":null,"NP":null,"수강중":null,"계획":null};
const GRADE_ALIAS = {"A":4.0,"B":3.0,"C":2.0,"D":1.0,"A-":4.0,"B-":3.0,"C-":2.0,"D-":1.0,"NP":null,"NR":null,"S":null,"U":null,"PASS":null};
function gp(gr){ const raw=String(gr==null?'':gr).trim(); if(raw in GRADES) return GRADES[raw];
  const k=raw.toUpperCase(); if(k in GRADE_ALIAS) return GRADE_ALIAS[k]; return null; }
const crOf = c => { const v=parseFloat(c.cr); return isFinite(v)&&v>0 ? v : 0; };
const isIng = c => c.gr==='수강중';
const isPlan = c => c.gr==='계획';

const isFail = c => c.gr==='F' || up(c.gr)==='NP';

/* ── 학기 ── */
const TERM_ORD = {"1":1,"S":2,"2":3,"W":4}, TERM_LBL = {"1":"1학기","S":"여름계절","2":"2학기","W":"겨울계절"};
function semIdx(s){ const a=String(s||'9-9').split('-'); return (Number(a[0])||9)*10 + (TERM_ORD[String(a[1]||'').toUpperCase()]||9); }
function semLabel(s){ const a=String(s||'').split('-'); return (a[0]||'?')+'학년 '+(TERM_LBL[String(a[1]||'').toUpperCase()]||a[1]||''); }
const sortedSems = () => S.sems.slice().sort((a,b)=>semIdx(a)-semIdx(b));

/* ── 경영 제1전공 요건 (26학번) ── */
const MAJOR_REQ = ["BUSS205","BUSS207","BUSS211","BUSS213","BUSS215","BUSS311","BUSS313","BUSS402"];
const BASIC_REQ = ["BUSS152","BUSS154","BUSS164","BUSS166"];

   → 새로 넣을 땐 고를 수 없게 빼고, 예전에 '핵심교양'으로 저장된 과목은 그대로 두되 계산은 교양선택처럼 */
const CATS = ["학문의기초","교양필수","교양선택","경제학필수","전공필수","전공선택","2전공","일반선택"];

/* ── 공거리 요건을 MAJORS 형식으로 보강 ── */
MAJORS.GGL.reqs = [

  { k:'3영역 경제학', need:6, list:CONV_POOL["융전-3영역"], area:true, minN:2 } ];

const MAJOR_CHOICES = {
  '이중': [['ECON_DOUBLE','경제학과','이중전공 · 39학점']],
  '융합': [['GGL','공공거버넌스와리더십','융합전공 · 36학점'],['FADM','패션디자인 및 머천다이징','융합전공 · 36학점'],['FINENG','금융공학','융합전공 · 36학점']],
  '심화': [['BIZ_DEEP','경영학과 심화','전공 66학점 · 영강 10과목']],
  '미정': [[null,'아직 안 정했어요','경영 요건만 먼저 볼래요']] };
function s2Def(){ const m = S.profile && S.profile.major; return m && MAJORS[m] && MAJORS[m].type!=='심화' ? MAJORS[m] : null; }
const isDeep = () => S.profile && S.profile.major==='BIZ_DEEP';
function profileLabel(){ const m=S.profile&&S.profile.major; if(!m) return '경영 (2전공 미정)'; if(m==='BIZ_DEEP') return '경영 심화'; return '경영 + '+MAJORS[m].title; }

/* ── 과목 DB (검색·자동 분류) ── */
const DB = []; const DBI = {};
function dbAdd(o){ const k=up(o.code); if(DBI[k]){ Object.keys(o).forEach(x=>{ if(DBI[k][x]==null) DBI[k][x]=o[x]; }); return DBI[k]; } o.code=k; DB.push(o); DBI[k]=o; return o; }
BIZ.forEach(c=>dbAdd({code:c.code,name:c.name,cat:c.cat,cr:c.cr,eng:c.eng,sem:c.sem}));
dbAdd({code:"ECON171",name:"경제원론Ⅰ",cat:"경제학필수",cr:3});
dbAdd({code:"ECON172",name:"경제원론Ⅱ",cat:"경제학필수",cr:3});
GEN_REQ.forEach(([code,name,cr])=>dbAdd({code,name,cat:"교양필수",cr}));
BIZ_ALT.forEach(([code,name])=>{ const d=dbAdd({code,name,cat:"전공선택",cr:3}); d.bizAlt=true; if(d.cat!=='경제학필수') d.cat='전공선택'; });
GYO.forEach(([code,name,cr,ga,tm,eng])=>{ const d=dbAdd({code,name,cat:"교양선택",cr}); d.ga=ga; d.tm=tm; if(eng) d.geng=1; });
ECON_CATALOG.forEach(([code,name,sem])=>dbAdd({code,name,cat:"2전공",cr:3,sem}));
Object.values(CONV_POOL).forEach(arr=>arr.forEach(([code,name])=>dbAdd({code,name,cat:/^GE|^HANM|^PHIL|^HOEW|^JURA10/.test(code)?"교양선택":"2전공",cr:3})));
['FADM','FINENG'].forEach(m=>MAJORS[m].reqs.forEach(r=>r.list.forEach(([code,name,cr])=>dbAdd({code,name,cat:/^BUSS/.test(code)?"전공선택":"2전공",cr:cr||3}))));
const bizCatOf = code => { const d=DBI[up(code)]; if(!d) return /^BUSS/.test(up(code)) ? '전공선택' : null; return d.cat; };
const nameOf = code => (DBI[up(code)]||{}).name || code;

/* ── 과목명 비교용 정규화: 공백·[진로·창업]·(영강)·로마숫자 표기 차이 무시 ── */
const ROMAN = {'Ⅰ':'I','Ⅱ':'II','Ⅲ':'III','Ⅳ':'IV','Ⅴ':'V'};
function normName(n){ return String(n||'').replace(/\[[^\]]*\]/g,'').replace(/\((영강|영어강의)\)/g,'').replace(/[ⅠⅡⅢⅣⅤ]/g,m=>ROMAN[m]).replace(/[\s·,\-_:]/g,'').toUpperCase(); }
const GYO_SET = new Set(GYO.map(x=>up(x[0])));

/* ── 2전공 소속 판정 ── */
function inReq(r, code){ const k=up(code); if(!k) return false;
  if(r.list && r.list.some(x=>up(x[0])===k)) return true;
  if(r.prefix && r.prefix.some(p=>k.startsWith(p)) && !GYO_SET.has(k)) return true;   // 교양 과목(예: ECON110 경제학개론)은 전공 아님
  return false; }
function inReqEx(def, r, code){ if(r.exclude){ const ex=def.reqs.find(x=>x.k===r.exclude); if(ex && inReq(ex,code)) return false; } return inReq(r,code); }
function s2Member(def, code){ return !!def && def.reqs.some(r=>inReqEx(def,r,code)); }
function s2Required(def, code){ return !!def && def.reqs.some(r=>(r.req || /전공필수/.test(r.k)) && inReq(r,code)); }

/* ── 이수 과목 정리: 재수강은 마지막 성적만, 학수번호 중복 제거 ── */
function latestByCode(list){
  const best = {};
  list.forEach(c=>{ const k = up(c.code) || ('#'+normName(c.name));
    const prev = best[k]; if(!prev || semIdx(c.sem) >= semIdx(prev.sem)) best[k] = c; });
  return Object.values(best); }
const takenAll = () => latestByCode(S.courses.filter(c=>!isIng(c) && !isPlan(c))).filter(c=>!isFail(c));   // 학점 인정 과목
const planCourses = () => S.courses.filter(isPlan);
/* 계획 포함 보기: 수강중·계획 과목도 들었다고 치고 계산 (같은 과목이면 가장 늦은 학기 것) */
const countedAll = () => PLAN_VIEW ? latestByCode(S.courses).filter(c=>!isFail(c)) : takenAll();
const ingCourses = () => S.courses.filter(isIng);
/* 요건 과목 이수 여부: 학수번호가 같거나, 과목명이 같으면 인정 (교양필수는 실제 학수번호가 학기마다 달라서) */
function findCourse(code, name, list){ const k=up(code), n=normName(name);
  return list.find(c=>(k && up(c.code)===k) || (n && normName(c.name)===n)); }
function reqStatus(code, name){
  const t = findCourse(code, name, takenAll()); if(t) return {st:'y', id:t.id};
  const i = findCourse(code, name, ingCourses()); if(i) return {st:'i', id:i.id};
  const p = findCourse(code, name, planCourses()); if(p) return {st:'p', id:p.id};
  return {st:'', id:null}; }
const hasCode = (code, name) => reqStatus(code, name).st==='y';
const ingCode = (code, name) => reqStatus(code, name).st==='i';
/* 교양체육(PHEK)은 3학점(1학점 3과목)까지만 인정
   출처: 교양교육원 수강신청 유의사항 https://ge.korea.ac.kr/_res/eduinfo/etc/info_caution_cultural.pdf · 확인 2026-11-08 */
const PE_CAP = 3;
const isPE = c => /^PHEK/.test(up(c.code));
const sumCr = list => list.reduce((s,c)=>s+crOf(c),0);
const peOver = list => Math.max(0, sumCr(list.filter(isPE)) - PE_CAP);
const capSum = list => sumCr(list) - peOver(list);      // 체육 초과분 뺀 학점
const totalCredits = () => capSum(takenAll());
const ingCredits = () => { const t = takenAll(); const add = latestByCode(ingCourses()).filter(c=>!findCourse(c.code,c.name,t));
  return capSum(t.concat(add)) - capSum(t); };
const planCredits = () => { const t = takenAll(), i = latestByCode(ingCourses()).filter(c=>!findCourse(c.code,c.name,t)), base = t.concat(i);
  const add = latestByCode(planCourses()).filter(c=>!findCourse(c.code,c.name,base)); return capSum(base.concat(add)) - capSum(base); };

/* ── 재수강: 같은 과목 n번째 수강 → 최고 성적 상한 (2번째 A0, 3번째 B+, 4번째 B0 …) ── */
const courseKey = c => up(c.code) || ('#'+normName(c.name));
function attempts(){
  const g = {}; S.courses.forEach(c=>{ (g[courseKey(c)] = g[courseKey(c)] || []).push(c); });
  const info = {};
  Object.values(g).forEach(list=>{ list.sort((a,b)=>semIdx(a.sem)-semIdx(b.sem) || String(a.id).localeCompare(String(b.id)));
    list.forEach((c,i)=>{ info[c.id] = { n:i+1, total:list.length, cap: i ? Math.max(1.0, 4.5 - 0.5*i) : 4.5, replaced: i < list.length-1 }; }); });
  return info; }
let ATT = {};
const capLabel = v => Object.keys(GRADES).find(k=>GRADES[k]===v) || v.toFixed(1);
function gpEff(c){ const g = gp(c.gr); if(g==null) return null; const a = ATT[c.id]; return a ? Math.min(g, a.cap) : g; }
/* 요건 칩: [학수번호, 과목명, 상태, 과목id] */
const chip = (code, name) => { const r = reqStatus(code, name); return [code, name, r.st, r.id]; };
const mineChips = list => list.map(c=>[c.code, c.name, isIng(c)?'i':isPlan(c)?'p':'y', c.id]);

/* ═══════════ 계산 엔진 ═══════════ */
function compute(){
  ATT = attempts();
  const def = s2Def(), deep = isDeep();
  const taken = countedAll();
  /* 1) 겹치는 과목 찾기 */
  const rows = taken.map(c=>{
    const biz = BIZ_MAJOR_CATS.includes(c.cat) ? c.cat : null;
    const s2  = s2Member(def, c.code);
    return { c, biz, s2, overlap: !!(biz && s2) };
  });
  /* 2) 중복인정 배정 — 양쪽 필수 > 한쪽 필수 > 먼저 들은 과목 순 */
  const cap = def && def.dual ? def.dual.cap||0 : 0;
  const bizReq = r => r.biz==='전공필수' || r.biz==='경제학필수' || r.biz==='학문의기초';
  const prio = r => (bizReq(r)?1:0) + (s2Required(def,r.c.code)?1:0);
  const cand = rows.filter(r=>r.overlap && (!r.c.side || r.c.side==='auto'))
    .sort((a,b)=> prio(b)-prio(a) || semIdx(a.c.sem)-semIdx(b.c.sem) || String(a.c.id).localeCompare(String(b.c.id)));
  let left = cap; const dualIds = new Set();
  cand.forEach(r=>{ const v=crOf(r.c); if(v>0 && left>=v){ dualIds.add(r.c.id); left-=v; } });
  /* 3) 나머지 겹치는 과목은 한쪽에만 — 직접 고른 쪽 > 필수인 쪽 > 더 많이 모자란 쪽 */
  const bizHave = {}; const s2Have = { v:0 }; const areaHave = {};
  const addS2 = c => { s2Have.v += crOf(c); const a=up(c.code).slice(0,4); areaHave[a]=(areaHave[a]||0)+crOf(c); };
  rows.forEach(r=>{ if(!r.overlap || dualIds.has(r.c.id)){ if(r.biz) bizHave[r.biz]=(bizHave[r.biz]||0)+crOf(r.c); if(r.s2) addS2(r.c); } });
  rows.filter(r=>r.overlap && !dualIds.has(r.c.id)).sort((a,b)=>semIdx(a.c.sem)-semIdx(b.c.sem)).forEach(r=>{
    let side;
    if(r.c.side==='biz' || r.c.side==='s2') side = r.c.side;
    else if(bizReq(r)) side = 'biz';
    else if(s2Required(def, r.c.code)) side = 's2';
    else {
      /* 2전공은 지정 과목이 필요하고 경영 전공선택은 BUSS 아무 과목으로 채울 수 있으니, 2전공이 덜 찼으면 2전공 우선.
         단 금융공학처럼 학과별 상한(12학점)이 있으면 꽉 찬 학과 과목은 경영으로 */
      const a = up(r.c.code).slice(0,4);
      const areaFull = def.areaCap && (areaHave[a]||0) + crOf(r.c) > def.areaCap.cr;
      side = ((def.total||0) - s2Have.v > 0 && !areaFull) ? 's2' : 'biz'; }
    if(side==='biz') bizHave[r.biz]=(bizHave[r.biz]||0)+crOf(r.c); else addS2(r.c);
    r.side = side;
  });
  rows.forEach(r=>{
    if(!r.overlap){ r.toBiz = !!r.biz; r.toS2 = r.s2; return; }
    if(dualIds.has(r.c.id)){ r.toBiz = r.toS2 = true; r.dual = true; return; }
    r.toBiz = r.side==='biz'; r.toS2 = r.side==='s2';
  });
  const bizSet = rows.filter(r=>r.toBiz).map(r=>r.c), s2Set = rows.filter(r=>r.toS2).map(r=>r.c);
  const s2Raw = rows.filter(r=>r.s2).reduce((s,r)=>s+crOf(r.c),0);
  const dualList = rows.filter(r=>r.dual).map(r=>r.c);
  const dualUsed = dualList.reduce((s,c)=>s+crOf(c),0);
  const th = def && def.dual ? def.dual.overThreshold||0 : 0;
  const ing = PLAN_VIEW ? [] : S.courses.filter(c=>isIng(c)||isPlan(c));   // 아직 안 센 과목 (칩으로만 표시)

  /* 4) 경영 */
  const inCat = cat => bizSet.filter(c=>c.cat===cat);
  const cr = cat => inCat(cat).reduce((s,c)=>s+crOf(c),0);
  const libCr = cat => taken.filter(c=>c.cat===cat).reduce((s,c)=>s+crOf(c),0);
  const genNeed = GEN_REQ.reduce((s,g)=>s+g[2],0);
  const engList = taken.filter(c=>c.eng && /^BUSS/i.test(c.code||''));
  const selPool = BIZ.filter(c=>c.cat==='전공선택').map(c=>[c.code,c.name]).concat(BIZ_ALT.map(x=>[x[0],x[1]+' (타학과 인정)']));
  const withIng = (list, cat) => mineChips(list.concat(ing.filter(c=>c.cat===cat && !findCourse(c.code,c.name,list))));
  const biz = [
    { k:'교양필수', got:libCr('교양필수'), need:genNeed, items:GEN_REQ.map(g=>chip(g[0], g[1].replace(/\[[^\]]*\]\s*/,''))), all:true },
    { k:'학문의기초', got:cr('학문의기초'), need:12, items:BASIC_REQ.map(c=>chip(c,nameOf(c))), all:true },
    { k:'전공필수', got:cr('전공필수'), need:24, items:MAJOR_REQ.map(c=>chip(c,nameOf(c))), all:true },
    { k:'전공선택', got:cr('전공선택'), need:deep?42:15, note:deep?'심화: 제1전공 15 + 심화 27':'BUSS 전공선택 + 타학과 인정과목', mine:withIng(inCat('전공선택'),'전공선택'), pool:selPool },
    { k:'경제학 필수', got:cr('경제학필수'), need:6, items:ECON_REQ.map(c=>chip(c,nameOf(c))), all:true },
    { k:'영어강의', got:engList.length, need:deep?10:8, unit:'과목', note:'학수번호 BUSS 영어강의만 인정', mine:mineChips(engList), pool:BIZ.filter(c=>c.eng).map(c=>[c.code,c.name+' (영강 분반 있음)']) } ];
  if(deep) biz.push({ k:'전공 합계 (심화)', got:cr('전공필수')+cr('전공선택'), need:66, note:'전공필수 24 + 전공선택 42', mine:mineChips(inCat('전공필수').concat(inCat('전공선택'))) });
  const okSt = x => PLAN_VIEW ? !!x[2] : x[2]==='y';
  biz.forEach(r=>{ r.done = r.all ? (r.items.every(okSt) && r.got>=r.need) : r.got>=r.need; });

  /* 5) 2전공 */
  let s2 = null;
  if(def) s2 = evalS2(def, s2Set, ing);
  if(s2){ s2.dual = { used:dualUsed, cap, list:dualList, raw:s2Raw, th, confirmed: th ? s2Raw > th : true, note:def.dual.note }; }

  /* 6) 평점 */
  const graded = latestByCode(S.courses.filter(c=>{ const g=gp(c.gr); return g!=null && crOf(c)>0; }));
  const avg = list => { let p=0,t=0; list.forEach(c=>{ p+=gpEff(c)*crOf(c); t+=crOf(c); }); return t? {avg:p/t, cr:t, n:list.length} : {avg:null, cr:0, n:0}; };
  const rowOf = c => rows.find(x=>x.c.id===c.id);
  const gpa = {
    all: avg(graded),
    biz: avg(graded.filter(c=>{ if(c.cat!=='전공필수' && c.cat!=='전공선택') return false; const r=rowOf(c); return !r || !r.overlap || r.toBiz; })),
    lib: avg(graded.filter(c=>LIB_CATS.includes(c.cat))),
    s2 : def ? avg(graded.filter(c=>{ if(!s2Member(def,c.code)) return false; const r=rowOf(c); return !r || !r.overlap || r.toS2; })) : null };
  const peTaken = sumCr(taken.filter(isPE)), peIng = PLAN_VIEW ? 0 : sumCr(latestByCode(ingCourses()).filter(c=>isPE(c) && !findCourse(c.code,c.name,taken)));
  return { def, deep, biz, s2, gpa, total: capSum(taken), pe:{ got:peTaken, ing:peIng }, done: totalCredits(), ing: ingCredits(), plan: planCredits(), engN: engList.length, rows };
}

function evalS2(def, set, ing){
  const inR = (r,c) => inReqEx(def, r, c.code);
  const crIn = (r, list=set) => list.filter(c=>inR(r,c)).reduce((s,c)=>s+crOf(c),0);
  const nIn  = (r, list=set) => list.filter(c=>inR(r,c)).length;
  const mineOf = (r, list=set) => mineChips(list.filter(c=>inR(r,c)).concat(ing.filter(c=>inR(r,c) && !findCourse(c.code,c.name,set))));
  const poolOf = r => r.list ? r.list.map(x=>[x[0],x[1]]) : r.prefix ? DB.filter(d=>inReqEx(def,r,d.code)).map(d=>[d.code,d.name]) : null;
  const out = { title:def.title, short:def.short, type:def.type, need:def.total, reqs:[] };

  if(def===MAJORS.GGL){
    const [nec, lib, a1, a2, a3] = def.reqs;
    const necCr = crIn(nec), libCr = Math.min(crIn(lib),3);
    const areas = [a1,a2,a3].map(a=>({ r:a, cr:crIn(a), n:nIn(a) }));
    const selTot = areas.reduce((s,a)=>s+a.cr,0), selN = areas.reduce((s,a)=>s+a.n,0);
    const areaOK = areas.every(a=>a.cr>=6 && a.n>=2);
    out.got = necCr + libCr + selTot;
    out.reqs.push({ k:nec.k, got:necCr, need:9, items:nec.list.map(x=>chip(x[0],x[1])), all:true });
    out.reqs.push({ k:lib.k, got:libCr, need:3, note:lib.note, mine:mineOf(lib), pool:poolOf(lib) });
    out.reqs.push({ k:'전공선택 합계', got:selTot, need:24, note:`${selN}과목 / 8과목 · ${areaOK?'영역별 최소요건 충족':'1·2·3영역 각 6학점(2과목) 이상 필요'}`,
      done: selTot>=24 && selN>=8 && areaOK, mine:mineChips(set.filter(c=>[a1,a2,a3].some(a=>inR(a,c)))) });
    areas.forEach(a=>out.reqs.push({ k:a.r.k, got:a.cr, need:6, note:`${a.n}과목 이수 · 최소 2과목`, mine:mineOf(a.r), pool:poolOf(a.r), done:a.cr>=6 && a.n>=2 }));
    out.extra = '추가 졸업요건: 공인영어성적 제출 (TOEIC 750 / TOEFL iBT 80 / TEPS 285 / IELTS 6.0 / TOSEL(A) 620)';
  }
  else if(def===MAJORS.FINENG){
    /* 영역(학과)별 최대 4과목·12학점까지만 인정 — 먼저 들은 과목부터 */
    const r = def.reqs[0]; const byArea = {};
    set.filter(c=>inR(r,c)).sort((a,b)=>semIdx(a.sem)-semIdx(b.sem)).forEach(c=>{
      const a = up(c.code).slice(0,4); const o = byArea[a] = byArea[a] || {cr:0,n:0,over:0};
      if(o.n < def.areaCap.n && o.cr + crOf(c) <= def.areaCap.cr){ o.cr += crOf(c); o.n++; } else o.over += crOf(c); });
    const got = Object.values(byArea).reduce((s,o)=>s+o.cr,0);
    out.got = got;
    out.reqs.push({ k:'전공선택 합계', got, need:36, note:'지정 교과목 · 학과(영역)별 최대 4과목·12학점까지만 인정', mine:mineOf(r), pool:poolOf(r) });
    const AREA_NM = {FNEG:'금융공학',MATH:'수학',BUSS:'경영',ECON:'경제',STAT:'통계',IMEN:'산업경영공학'};
    Object.keys(AREA_NM).forEach(a=>{ const o=byArea[a]||{cr:0,n:0,over:0};
      const sub = { list: r.list.filter(x=>up(x[0]).startsWith(a)) };
      out.reqs.push({ k:AREA_NM[a]+' 영역', got:o.cr, need:12, cap:true, note:`${o.n}과목 인정 · 최대 12학점${o.over?` · 초과 ${fmt(o.over)}학점 불인정`:''}`,
        mine:mineChips(set.filter(c=>inReq(sub,c.code)).concat(ing.filter(c=>inReq(sub,c.code)))), pool:sub.list }); });
  }
  else {
    let got = 0;
    def.reqs.forEach(r=>{
      const c = crIn(r); got += Math.min(c, r.need);
      const small = r.list && r.list.length<=10;
      out.reqs.push(small ? { k:r.k, got:c, need:r.need, note:r.note, items:r.list.map(x=>chip(x[0],x[1])), all:true }
                          : { k:r.k, got:c, need:r.need, note:r.note, mine:mineOf(r), pool:poolOf(r) });
    });
    if(def.deptMin){
      const allList = def.reqs.flatMap(r=>r.list||[]);
      def.deptMin.depts.forEach(([p,nm])=>{ const sub = { list: allList.filter(x=>up(x[0]).startsWith(p)) };
        out.reqs.push({ k:nm+' 이수', got:crIn(sub), need:def.deptMin.min, note:`${p} 과목 · 참여학과별 최소 6학점 (전공필수 포함)`, mine:mineOf(sub), pool:sub.list }); }); }
    out.got = got;
  }
  out.reqs.forEach(r=>{ if(r.done===undefined) r.done = r.cap ? false : r.all ? (r.items.every(x=>PLAN_VIEW ? !!x[2] : x[2]==='y') && r.got>=r.need) : r.got>=r.need; });
  return out;
}

function semStats(){
  return sortedSems().map(sm=>{
    const idx = semIdx(sm), inSem = S.courses.filter(c=>c.sem===sm);
    let p=0,t=0; inSem.forEach(c=>{ const g=gpEff(c), v=crOf(c); if(g!=null && v>0){ p+=g*v; t+=v; } });
    let cp=0, ct=0;
    latestByCode(S.courses.filter(c=>semIdx(c.sem)<=idx && gp(c.gr)!=null && crOf(c)>0)).forEach(c=>{ cp+=gpEff(c)*crOf(c); ct+=crOf(c); });
    const ing = inSem.some(isIng);
    return { sem:sm, label:semLabel(sm), n:inSem.length, gpa:t? p/t : null, cum: ct? cp/ct : null,
      earned: inSem.filter(c=>!isIng(c) && !isPlan(c) && !isFail(c)).reduce((a,c)=>a+crOf(c),0),
      enrolled: inSem.filter(c=>!isPlan(c)).reduce((a,c)=>a+crOf(c),0), ing, plan: inSem.length>0 && inSem.every(isPlan) };
  });
}

      body: JSON.stringify(body) });
    if(!r.ok) throw new Error('서버 응답 ' + r.status + (r.status>=500 ? ' (Supabase 일시정지 여부 확인)' : ''));
    return await r.json();
  }catch(e){

    if(e instanceof TypeError) throw new Error('네트워크 연결 실패 · ' + (e.message||''));
    throw e;
  }finally{ clearTimeout(to); }
}

}

/* ── 로그인 ── */
async function tryLogin(key){
  let lastErr = null;
  for(const wait of [0, 1200, 3000]){           // 첫 요청이 자주 실패하는 아이폰 대응: 3번까지
    if(wait) await new Promise(r=>setTimeout(r, wait));
    try{ return await rpc('kg_login', { p_key:key }); }catch(e){ lastErr = e; }
  }
  throw lastErr;
}
async function doLogin(raw){
  raw = String(raw||'').trim().toUpperCase();
  if(!raw){ gateMsg('접근키를 입력해 주세요','err'); return; }
  gateBusy(true); gateMsg('확인 중…','');
  try{
    const r = await tryLogin(raw);
    if(!r || !r.ok){ gateMsg('사용할 수 없는 접근키예요. 다시 확인해 주세요.','err'); try{ localStorage.removeItem(LS_LAST); }catch(e){} return; }
    KEY = raw; try{ localStorage.setItem(LS_LAST, KEY); }catch(e){}
    const remote = normalize(r.data), local = lsLoad();
    if(remote && (!local || remote.ts >= local.ts)){ S = remote; }
    else if(local){ S = local; SYNC.dirty = true; }
    else S = blankState();
    lsSave(); SYNC.lastOk = Date.now(); setSync('ok','저장됨');
    afterLogin();
    if(SYNC.dirty) push();
  }catch(e){
    /* 네트워크 문제: 이 기기에 기록이 있으면 일단 열고 뒤에서 계속 재시도 */
    KEY = raw; const local = lsLoad();
    if(local){ S = local; try{ localStorage.setItem(LS_LAST, KEY); }catch(_){} SYNC.lastErr = e.message;
      afterLogin(); setSync('err','오프라인 · 자동 재시도'); scheduleRetry(); }
    else { KEY = null; gateMsg('서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요. ('+e.message+')','err'); }
  }finally{ gateBusy(false); }
}
function logout(){
  if(SYNC.dirty) push({keepalive:true});
  if(!confirm('다른 접근키로 로그인할까요?\n이 기기에 저장된 기록은 그대로 남아요.')) return;
  try{ localStorage.removeItem(LS_LAST); }catch(e){} location.reload();
}

const GYF = { q:'', area:'all', next:true, eng:false, hide:true, n:60 };
function gyoRow(it, back){
  const q = reqStatus(it.code, it.name);
  const areaL = it.pe ? '체육' : it.ga!=null ? GYO_AREAS[it.ga] : '교양';
  const tags = [it.law ? '<span class="l">공거리 인정</span>' : '', it.ga!=null && it.ga<7 ? `<span class="a">${esc(areaL)}</span>` : (it.law && it.ga==null ? '' : esc(areaL))].filter(Boolean).join(' · ');
  const extra = it.cat && it.cat!=='교양선택' && it.cat!=='2전공' ? ' · ' + esc(it.cat==='전공선택' ? '경영 전공선택 인정' : it.cat) : '';
  const btn = q.st ? `<button class="add ${q.st}" onclick="closeSheet();openCourse({id:'${q.id}'${back?",back:'gyo'":''}})">${q.st==='y'?'✓ 이수':q.st==='i'?'수강중':'계획'}</button>`
                   : `<button class="add" onclick="closeSheet();openCourse({code:'${esc(it.code)}',plan:true${back?",back:'gyo'":''}})" aria-label="${esc(it.name)} 수강계획에 담기">+</button>`;
  return `<div class="gcr"><div class="n"><b>${esc(it.name)}</b><small>${tags} · ${fmt(it.cr)}학점 · ${esc(gyoTermText(it.tm))}${it.eng?' · 영강':''}${extra}</small></div>${btn}</div>`; }
function gyoMatch(it, f, kind){
  const a = f.area;
  if(a==='law' && !it.law) return false;
  if(a==='pe' && !it.pe) return false;
  if(a==='etc' && !(it.ga>=10)) return false;
  if(/^\d+$/.test(a) && (it.pe || it.ga!==+a)) return false;
  if(f.next && it.tm && !gyoLikely(it.tm, kind)) return false;
  if(f.eng && !it.eng) return false;
  if(f.hide && reqStatus(it.code, it.name).st==='y') return false;
  if(f.q){ const q = normName(f.q); if(q && !normName(it.name).includes(q) && !it.code.includes(q)) return false; }
  return true; }

/* ── 성적 추이 차트 (학기 평점 / 누적 평점 · 학기별 학점) ── */
const C_SEM = '#b3123f', C_CUM = '#3182f6';
let trendMode = 'gpa';
function trendRows(){ return semStats().filter(r=>r.gpa!=null || r.ing); }
function trendHTML(uid){
  const rows = trendRows(), done = rows.filter(r=>r.gpa!=null), last = done[done.length-1];
  const ingR = rows.find(r=>r.ing && r.gpa==null);
  const head = !rows.length ? '' : trendMode==='gpa'
    ? `<div class="kpi2"><b>${last? last.cum.toFixed(2) : '–'}</b><span>누적 평점${last?' · 직전 학기 '+last.gpa.toFixed(2):''}</span></div>`
    : `<div class="kpi2"><b>${fmt(totalCredits())}<i>/130</i></b><span>누적 취득학점${ingR?' · 이번 학기 '+fmt(ingR.enrolled)+'학점 수강중':''}</span></div>`;
  return `<h2>성적 추이 <span class="sp"></span><span class="mini-seg"><button class="${trendMode==='gpa'?'on':''}" onclick="trendMode='gpa';renderGrad()">평점</button><button class="${trendMode==='cr'?'on':''}" onclick="trendMode='cr';renderGrad()">학점</button></span></h2>
    ${head}${trendMode==='gpa' && done.length?`<div class="lg"><span><i style="background:${C_SEM}"></i>학기 평점</span><span><i class="dash" style="color:${C_CUM}"></i>누적 평점</span></div>`:''}
    <div class="chart" id="ch-${uid}"></div>
    ${rows.length?`<details class="tbl"><summary>표로 보기</summary><table><thead><tr><th>학기</th><th>평점</th><th>누적</th><th>취득</th></tr></thead><tbody>
      ${rows.map(r=>`<tr><td>${r.label}</td><td>${r.gpa==null?'수강중':r.gpa.toFixed(2)}</td><td>${r.cum==null?'–':r.cum.toFixed(2)}</td><td>${fmt(r.earned)}</td></tr>`).join('')}</tbody></table></details>`:''}`;
}
function wireTrend(uid){
  const box = $('ch-'+uid); if(!box || !box.offsetParent) return;
  const rows = trendRows(), n = rows.length;
  if(!n){ box.innerHTML = '<div class="lempty">성적을 입력하면 학기별 추이가 그려져요</div>'; return; }
  const W = Math.max(280, box.clientWidth), H = W<420?210:240, L=32, Rr=10, T=22, B=30;
  const x = i => L + (W-L-Rr)*(i+.5)/n;
  const lab = r => { const a=r.sem.split('-'); return a[0]+'-'+({1:'1',2:'2',S:'여름',W:'겨울'}[a[1]]||a[1]); };
  let svg = '';
  if(trendMode==='gpa'){
    const pts = rows.filter(r=>r.gpa!=null);
    if(!pts.length){ box.innerHTML = '<div class="lempty">성적이 나온 학기가 아직 없어요</div>'; return; }
    const vals = pts.flatMap(r=>[r.gpa,r.cum]); const lo = Math.max(0, Math.floor((Math.min(...vals)-.25)*2)/2), hi = 4.5;
    const y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
    for(let v=lo; v<=hi+1e-9; v+=.5) svg += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-7}" y="${y(v)+4}" class="ax" text-anchor="end">${v.toFixed(1)}</text>`;
    const path = k => pts.map((r,i)=>`${i?'L':'M'}${x(rows.indexOf(r))},${y(r[k])}`).join(' ');
    const dots = (k,c) => pts.map(r=>`<circle cx="${x(rows.indexOf(r))}" cy="${y(r[k])}" r="4.5" fill="${c}" style="stroke:var(--card)" stroke-width="2"/>`).join('');
    const Lp = pts[pts.length-1], li = rows.indexOf(Lp), close = Math.abs(y(Lp.gpa)-y(Lp.cum))<16, upr = y(Lp.gpa)<=y(Lp.cum);
    svg += `<path d="${path('cum')}" fill="none" stroke="${C_CUM}" stroke-width="2" stroke-dasharray="5 4"/><path d="${path('gpa')}" fill="none" stroke="${C_SEM}" stroke-width="2" stroke-linejoin="round"/>${dots('cum',C_CUM)}${dots('gpa',C_SEM)}
      <text x="${Math.min(x(li),W-Rr-16)}" y="${y(Lp.gpa)+(upr?-12-(close?8:0):18+(close?8:0))}" class="dl" text-anchor="middle">${Lp.gpa.toFixed(2)}</text>
      ${pts.length>1?`<text x="${Math.min(x(li),W-Rr-16)}" y="${y(Lp.cum)+(upr?18+(close?8:0):-12-(close?8:0))}" class="dl mut" text-anchor="middle">${Lp.cum.toFixed(2)}</text>`:''}`;
  } else {
    const hi = Math.ceil(Math.max(24, ...rows.map(r=>Math.max(r.earned, r.enrolled)))/6)*6, y = v => T + (H-T-B)*(1-v/hi), bw = Math.min(40,(W-L-Rr)/n*.5), rr=4;
    for(let v=0; v<=hi; v+=6) svg += `<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" class="gl${v===0?' base':''}"/><text x="${L-7}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`;
    rows.forEach((r,i)=>{ const v = r.gpa==null ? r.enrolled : r.earned; if(!v) return; const x0=x(i)-bw/2, top=y(v), b=y(0);
      const d=`M${x0},${b} V${top+rr} Q${x0},${top} ${x0+rr},${top} H${x0+bw-rr} Q${x0+bw},${top} ${x0+bw},${top+rr} V${b} Z`;
      svg += r.gpa==null ? `<path d="${d}" fill="none" stroke="${C_SEM}" stroke-width="1.5" stroke-dasharray="4 3"/>` : `<path d="${d}" fill="${C_SEM}"/>`;
      if(i===n-1) svg += `<text x="${x(i)}" y="${top-8}" class="dl" text-anchor="middle">${fmt(v)}</text>`; });
  }
  const every = Math.ceil(n / Math.max(1, Math.floor((W-L-Rr)/44)));
  rows.forEach((r,i)=>{ if(i%every===0 || i===n-1) svg += `<text x="${x(i)}" y="${H-9}" class="ax" text-anchor="middle">${lab(r)}</text>`; });
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="학기별 성적 추이"><line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" style="visibility:hidden"/>${svg}</svg><div class="tip"></div>`;
  const sv = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = sv.querySelector('.xh');
  const move = ev => {
    const rc = sv.getBoundingClientRect(), px = (ev.clientX-rc.left)/rc.width*W;
    let i = Math.round((px-L)/((W-L-Rr)/n) - .5); i = Math.max(0, Math.min(n-1, i)); const d = rows[i];
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.style.visibility='visible';
    tip.textContent=''; const h=document.createElement('div'); h.className='th'; h.textContent=d.label; tip.appendChild(h);
    const line=(c,val,lb,dash)=>{ const e=document.createElement('div'); e.className='tr2'; const k=document.createElement('i'); if(dash){k.className='dash'; k.style.color=c;} else k.style.background=c;
      const b=document.createElement('b'); b.textContent=val; const s=document.createElement('span'); s.textContent=lb; e.append(k,b,s); tip.appendChild(e); };
    if(d.gpa==null) line(C_SEM, fmt(d.enrolled)+'학점', '수강중 · 성적 미확정');
    else { line(C_SEM, d.gpa.toFixed(2), '학기 평점'); line(C_CUM, d.cum.toFixed(2), '누적 평점', true); line('#8b95a1', fmt(d.earned)+'학점', '취득'); }
    tip.style.display='block'; const tw=tip.offsetWidth; tip.style.left = Math.max(4, Math.min(rc.width-tw-4, x(i)/W*rc.width - tw/2))+'px'; };
  sv.addEventListener('pointermove', move); sv.addEventListener('pointerdown', move);
  sv.addEventListener('pointerleave', ()=>{ tip.style.display='none'; xh.style.visibility='hidden'; });
}

/* ═══════════════════════════════════════════════════════════════
   LEET (설정에서 켠 사람만)
   · 기출: 학년도 + 회독 + 맞은 개수 → 표준점수·백분위 자동 계산
       2023~2027 = 로연 환산표(표 밖 원점수는 표에서 역산한 평균·표편으로 외삽)
       2012~2022 = 기존 확장프로그램 추정치 (2025 추리 표편 오류는 로연 표로 교체됨)
   · 사설: 기관 성적표의 원점수·표점·백분위를 그대로 기록
   ═══════════════════════════════════════════════════════════════ */
const LEET_SUB = { eoneo:'언어이해', churi:'추리논증' };
const LEET_ORGS = ['법률저널 LEET MASTER','메가로스쿨','시대인재'];
function normCdf(z){ const t=1/(1+0.2316419*Math.abs(z)), d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274)))); return z>0?1-p:p; }
function leetConv(year, sub, raw){
  const y = LEET_DATA.years[year], sc = LEET_DATA.scales[y.scale][sub], p = y[sub];
  const hit = p.t && p.t[String(raw)];
  if(hit) return { std:hit[0], pct:hit[1], exact:true };
  const z = (raw - p.m) / p.sd;
  return { std: Math.round((sc.m + sc.s*z)*10)/10, pct: Math.round(Math.min(99.9, Math.max(0, normCdf(z)*100))*10)/10, exact:false };
}
const LEET_YEARS = Object.keys(LEET_DATA.years).sort((a,b)=>b-a);
const leetQ = (year, sub) => LEET_DATA.scales[LEET_DATA.years[year].scale][sub].q;
const L_COL = ['#b3123f','#3182f6','#0e9f6e','#d97706'];   // 명도·색각이상 대비 검증 통과 4색 (고정 순서)
const LV = { mode:'past', metric:'std', subj:'sum' };
let LF = { kind:'past', year:'2027', round:'', e:'', c:'', org:LEET_ORGS[0], orgFree:'', name:'', er:'', es:'', ep:'', cr:'', cs:'', cp:'', date:'' };
const recs = () => (S.leet && S.leet.recs) || [];
const f1 = v => v==null||isNaN(v) ? '–' : (Math.round(v*10)/10).toFixed(1);
const sumStd = r => (r.e.std!=null && r.c.std!=null) ? r.e.std + r.c.std : null;
function lval(r){
  const m = LV.metric, pick = s => m==='std'? s.std : m==='pct'? s.pct : s.raw;
  const a = pick(r.e), b = pick(r.c);
  if(LV.subj==='eoneo') return a ?? null; if(LV.subj==='churi') return b ?? null;
  if(a==null||b==null) return null; return m==='pct' ? (a+b)/2 : a+b; }
const metricLabel = () => ({std:'표준점수',pct:'백분위',raw:'원점수'})[LV.metric] + (LV.subj==='sum' ? (LV.metric==='pct'?' 평균':' 합') : ' · '+LEET_SUB[LV.subj]);
const recTitle = r => r.kind==='past' ? `${r.year}학년도 기출 · ${r.round}회독` : `${r.org} ${r.name||''}`.trim();

function leetSeries(){
  if(LV.mode==='past'){
    const rs = recs().filter(r=>r.kind==='past'), years = [...new Set(rs.map(r=>r.year))].sort();
    const rounds = [...new Set(rs.map(r=>+r.round))].sort((a,b)=>a-b);
    return { labels: years.map(y=>"'"+String(y).slice(2)), full: years.map(y=>y+'학년도 기출'), connect:false,
      series: rounds.slice(0,4).map((rd,i)=>({ name:rd+'회독', color:L_COL[i], data: years.map(y=>{ const r=rs.find(x=>x.year==y && +x.round===rd); return r? lval(r):null; }) })) };
  }
  const rs = recs().filter(r=>r.kind==='mock').sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const labels = rs.map(r=>String(r.date||'').slice(5).replace('-','/')), full = rs.map(recTitle);
  if(LV.mode==='org'){
    const orgs = [...new Set(rs.map(r=>r.org))]; const main = orgs.slice(0,3), rest = orgs.slice(3);
    const series = main.map((o,i)=>({ name:o, color:L_COL[i], data: rs.map(r=>r.org===o? lval(r):null) }));
    if(rest.length) series.push({ name:'기타', color:L_COL[3], data: rs.map(r=>rest.includes(r.org)? lval(r):null) });
    return { labels, full, connect:true, series };
  }
  const d = rs.map(lval), ok = d.filter(v=>v!=null);
  return { labels, full, connect:true, avg: ok.length? ok.reduce((a,b)=>a+b,0)/ok.length : null, series:[{ name:'사설 전체', color:L_COL[0], data:d }] };
}

function leetChart(){
  const box = $('lch'); if(!box || !box.offsetParent) return;
  const Sx = leetSeries(), n = Sx.labels.length;
  const W = Math.max(280, box.clientWidth), H = W<420? 220 : 270, L=34, R=12, T=22, B=30;
  const all = Sx.series.flatMap(s=>s.data).filter(v=>v!=null);
  if(!all.length){ box.innerHTML = `<div class="lempty">${LV.mode==='past'?'기출 기록을 추가하면':'사설 기록을 추가하면'} 추이가 그려져요</div>`; return; }
  let lo = Math.min(...all), hi = Math.max(...all), pad = Math.max(2,(hi-lo)*.15);
  const step = [1,2,5,10,20,25,50].find(s=>(hi-lo+2*pad)/s <= 5) || 50;
  lo = Math.floor((lo-pad)/step)*step; hi = Math.ceil((hi+pad)/step)*step;
  if(LV.metric==='pct'){ lo=Math.max(0,lo); hi=Math.min(100,hi); }
  const x = i => L + (W-L-R)*(i+.5)/n, y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  let g=''; for(let v=lo; v<=hi+1e-9; v+=step) g += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${L-7}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`;
  const every = Math.ceil(n / Math.max(1, Math.floor((W-L-R)/50)));
  const xl = Sx.labels.map((l,i)=> i%every===0 || i===n-1 ? `<text x="${x(i)}" y="${H-9}" class="ax" text-anchor="middle">${esc(l)}</text>`:'').join('');
  const placed = [];
  const lines = Sx.series.map(s=>{
    let d='', pen=false;
    s.data.forEach((v,i)=>{ if(v==null){ if(!Sx.connect) pen=false; return; } d += (pen?'L':'M')+x(i)+','+y(v)+' '; pen=true; });
    const dots = s.data.map((v,i)=> v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${s.color}" style="stroke:var(--card)" stroke-width="2"/>`).join('');
    let li=-1; s.data.forEach((v,i)=>{ if(v!=null) li=i; });
    let lab='';
    if(li>=0){ const lx = Math.min(x(li), W-R-18), ly = y(s.data[li]) - 12;          // 끝점 라벨 — 겹치면 생략(범례·툴팁으로 확인)
      if(!placed.some(p=>Math.abs(p[0]-lx)<48 && Math.abs(p[1]-ly)<16)){ placed.push([lx,ly]); lab = `<text x="${lx}" y="${ly}" class="dl" text-anchor="middle">${f1(s.data[li])}</text>`; } }
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lab}`;
  }).join('');
  const avg = Sx.avg!=null ? `<line x1="${L}" x2="${W-R}" y1="${y(Sx.avg)}" y2="${y(Sx.avg)}" stroke="#8b95a1" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${L+4}" y="${y(Sx.avg)-6}" class="ax">평균 ${f1(Sx.avg)}</text>` : '';
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${metricLabel()} 추이">${g}${xl}${avg}<line class="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" style="visibility:hidden"/>${lines}</svg><div class="tip"></div>`;
  const sv = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = sv.querySelector('.xh');
  const move = ev => {
    const rc = sv.getBoundingClientRect(), px = (ev.clientX-rc.left)/rc.width*W;
    let i = Math.round((px-L)/((W-L-R)/n) - .5); i = Math.max(0, Math.min(n-1, i));
    xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.style.visibility='visible';
    tip.textContent=''; const h=document.createElement('div'); h.className='th'; h.textContent=Sx.full[i]; tip.appendChild(h);
    Sx.series.forEach(s=>{ if(s.data[i]==null) return; const e=document.createElement('div'); e.className='tr2';
      const k=document.createElement('i'); k.style.background=s.color; const b=document.createElement('b'); b.textContent=f1(s.data[i]);
      const sp=document.createElement('span'); sp.textContent = Sx.series.length>1 ? s.name : metricLabel(); e.append(k,b,sp); tip.appendChild(e); });
    tip.style.display='block'; const tw=tip.offsetWidth; tip.style.left = Math.max(4, Math.min(rc.width-tw-4, x(i)/W*rc.width - tw/2))+'px'; };
  sv.addEventListener('pointermove', move); sv.addEventListener('pointerdown', move);
  sv.addEventListener('pointerleave', ()=>{ tip.style.display='none'; xh.style.visibility='hidden'; });
}

function renderLeet(){
  const all = recs(), past = all.filter(r=>r.kind==='past'), mock = all.filter(r=>r.kind==='mock');
  const avg = a => { const v=a.map(sumStd).filter(x=>x!=null); return v.length? v.reduce((p,q)=>p+q,0)/v.length : null; };
  const last = all.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).pop();
  const sums = all.map(sumStd).filter(x=>x!=null);
  $('lhero').innerHTML = last ? `<div class="k">최근 기록 · ${esc(recTitle(last))}</div>
      <h1><em>${f1(sumStd(last))}</em> <span class="u">표점합</span></h1>
      <div class="nums3"><div><small>기출 평균</small><b>${f1(avg(past))}</b></div><div><small>사설 평균</small><b>${f1(avg(mock))}</b></div><div><small>최고</small><b>${sums.length?f1(Math.max(...sums)):'–'}</b></div></div>`
    : `<div class="k">LEET</div><h1 style="font-size:24px">첫 점수를 기록해 보세요</h1><p class="mut s">기출은 맞은 개수만 넣으면 표점·백분위가 자동으로 나와요.</p>`;
  $('lseg').innerHTML = [['past','기출'],['org','사설 기관별'],['all','사설 전체']]
    .map(([k,l])=>`<button class="${LV.mode===k?'on':''}" onclick="LV.mode='${k}';renderLeet()">${l}</button>`).join('');
  const Sx = leetSeries();
  const ctl = (key, opts) => `<span class="mini-seg">${opts.map(([k,l])=>`<button class="${LV[key]===k?'on':''}" onclick="LV.${key}='${k}';renderLeet()">${l}</button>`).join('')}</span>`;
  const rounds = [...new Set(past.map(r=>+r.round))].sort((a,b)=>a-b).map(rd=>({rd, v:avg(past.filter(r=>+r.round===rd))}));
  const roundKpi = LV.mode==='past' && rounds.length>1 ? `<div class="rk">${rounds.slice(0,4).map((o,i)=>`<span><i style="background:${L_COL[i]}"></i>${o.rd}회독 평균 <b>${f1(o.v)}</b>${i && o.v!=null && rounds[i-1].v!=null?`<em class="${o.v>=rounds[i-1].v?'up':'dn'}">${o.v>=rounds[i-1].v?'▲':'▼'} ${f1(Math.abs(o.v-rounds[i-1].v))}</em>`:''}</span>`).join('')}</div>` : '';
  $('lchartBox').innerHTML = `<h2>${LV.mode==='past'?'기출 회독별 추이':LV.mode==='org'?'사설 기관별 추이':'사설 전체 추이'}</h2>
    <div class="ctl">${ctl('metric',[['std','표점'],['pct','백분위'],['raw','원점수']])}${ctl('subj',[['sum','합산'],['eoneo','언어'],['churi','추리']])}</div>
    ${roundKpi}${Sx.series.length>1 && !roundKpi?`<div class="lg">${Sx.series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}
    <div class="chart" id="lch"></div>
    <p class="demo">${LV.mode==='past'?'가로축 = 기출 학년도 · 회독마다 선이 나뉘어요':'가로축 = 응시일 순서'} · ${metricLabel()}</p>`;
  leetChart();
  const list = all.filter(r=> LV.mode==='past' ? r.kind==='past' : r.kind==='mock').sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $('llist').innerHTML = `<h2>${LV.mode==='past'?'기출 기록':'사설 기록'} <span class="sp"></span><small>${list.length}개</small></h2>`
    + (list.length ? list.map(r=>`<div class="lrec"><div class="m"><b>${esc(recTitle(r))}</b>
        <small>${esc(String(r.date||'').slice(5).replace('-','/'))} · 언어 ${r.e.raw??'–'} / 추리 ${r.c.raw??'–'}${r.kind==='past' && !(r.e.exact&&r.c.exact)?' · 일부 추정':''}</small></div>
        <div class="r"><b>${f1(sumStd(r))}</b><small>${f1(r.e.std)} + ${f1(r.c.std)}</small></div>
        <button class="x" onclick="delLeet('${r.id}')" title="삭제">✕</button></div>`).join('') : '<div class="mut s" style="padding:10px 0">아직 기록이 없어요</div>');
  renderLeetForm();
}
function delLeet(id){ if(!confirm('이 기록을 지울까요?')) return; S.leet.recs = recs().filter(r=>r.id!==id); touch(); renderLeet(); }

function renderLeetForm(){
  const F = LF, el = $('lform'); if(!el) return;
  if(!F.date) F.date = new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  const kindSeg = `<span class="mini-seg wide">${[['past','기출'],['mock','사설 모의고사']].map(([k,l])=>`<button class="${F.kind===k?'on':''}" onclick="LF.kind='${k}';renderLeetForm()">${l}</button>`).join('')}</span>`;
  let body = '';
  if(F.kind==='past'){
    const nextRound = 1 + Math.max(0, ...recs().filter(r=>r.kind==='past' && r.year==F.year).map(r=>+r.round));
    const qe = leetQ(F.year,'eoneo'), qc = leetQ(F.year,'churi');
    body = `<div class="frow"><label>학년도<select onchange="LF.year=this.value;LF.round='';renderLeetForm()">${LEET_YEARS.map(y=>`<option ${y===F.year?'selected':''}>${y}</option>`).join('')}</select></label>
      <label>회독<input type="number" min="1" inputmode="numeric" value="${F.round||nextRound}" oninput="LF.round=this.value"></label></div>
      <div class="frow"><label>언어 맞은 개수 <em>/${qe}</em><input type="number" inputmode="numeric" min="0" max="${qe}" value="${esc(F.e)}" oninput="LF.e=this.value;leetPreview()"></label>
      <label>추리 맞은 개수 <em>/${qc}</em><input type="number" inputmode="numeric" min="0" max="${qc}" value="${esc(F.c)}" oninput="LF.c=this.value;leetPreview()"></label></div>
      <div class="pv" id="lpv"></div>`;
  } else {
    const inp = (k, mode) => `<input inputmode="${mode}" value="${esc(F[k])}" oninput="LF.${k}=this.value">`;
    body = `<div class="frow"><label>기관<select onchange="LF.org=this.value;renderLeetForm()">${LEET_ORGS.concat(['직접 입력']).map(o=>`<option ${o===F.org?'selected':''}>${o}</option>`).join('')}</select></label>
      <label>회차<input placeholder="예: 5회" value="${esc(F.name)}" oninput="LF.name=this.value"></label></div>
      ${F.org==='직접 입력'?`<div class="frow"><label>기관 이름<input value="${esc(F.orgFree)}" oninput="LF.orgFree=this.value"></label></div>`:''}
      <table class="ftab"><thead><tr><th></th><th>원점수</th><th>표점</th><th>백분위</th></tr></thead><tbody>
        <tr><td>언어</td><td>${inp('er','numeric')}</td><td>${inp('es','decimal')}</td><td>${inp('ep','decimal')}</td></tr>
        <tr><td>추리</td><td>${inp('cr','numeric')}</td><td>${inp('cs','decimal')}</td><td>${inp('cp','decimal')}</td></tr></tbody></table>
      <div class="pv muted">기관 성적표의 표점·백분위를 그대로 적어요. 사설은 응시자 집단이 실제 리트와 달라서 기출 환산표로 추정하지 않아요.</div>`;
  }
  el.innerHTML = `<h2>점수 기록 <span class="sp"></span><button class="gx sm" onclick="document.body.classList.remove('lf-open')">✕</button></h2>${kindSeg}${body}
    <label class="dt">응시일<input type="date" value="${F.date}" onchange="LF.date=this.value"></label><button class="savebtn" onclick="saveLeet()">저장</button>`;
  leetPreview();
}
function leetPreview(){
  const F = LF, el = $('lpv'); if(!el) return;
  const qe = leetQ(F.year,'eoneo'), qc = leetQ(F.year,'churi');
  const ok = (v,q) => v!=='' && !isNaN(+v) && +v>=0 && +v<=q;
  if(F.e==='' && F.c===''){ el.innerHTML = `<span class="muted">맞은 개수를 넣으면 ${F.year}학년도 기준 표점·백분위가 바로 나와요</span>`; return; }
  const pe = ok(F.e,qe)? leetConv(F.year,'eoneo',+F.e):null, pc = ok(F.c,qc)? leetConv(F.year,'churi',+F.c):null;
  const cell = (t,p) => p? `<div><small>${t}</small><b>${f1(p.std)}</b><em>백분위 ${f1(p.pct)}${p.exact?'':' · 추정'}</em></div>` : `<div><small>${t}</small><b>–</b></div>`;
  el.innerHTML = `<div class="pvg">${cell('언어 표점',pe)}${cell('추리 표점',pc)}<div><small>표점합</small><b>${pe&&pc? f1(pe.std+pc.std):'–'}</b><em>${LEET_DATA.years[F.year].src==='환산표'?'로연 환산표 기준':'기존 추정치 기준'}</em></div></div>`;
}
function saveLeet(){
  const F = LF, id = 'l'+Date.now().toString(36); const num = v => v===''||v==null||isNaN(+v) ? null : +v;
  let rec;
  if(F.kind==='past'){
    const qe = leetQ(F.year,'eoneo'), qc = leetQ(F.year,'churi'), e=num(F.e), c=num(F.c);
    if(e==null || c==null || e<0 || c<0 || e>qe || c>qc){ alert(`맞은 개수를 확인해 주세요 (언어 0~${qe}, 추리 0~${qc})`); return; }
    const round = num(F.round) || (1 + Math.max(0, ...recs().filter(r=>r.kind==='past' && r.year==F.year).map(r=>+r.round)));
    rec = { id, kind:'past', year:F.year, round, date:F.date, e:{raw:e, ...leetConv(F.year,'eoneo',e)}, c:{raw:c, ...leetConv(F.year,'churi',c)} };
  } else {
    const org = F.org==='직접 입력' ? F.orgFree.trim() : F.org;
    if(!org){ alert('기관 이름을 적어 주세요'); return; }
    rec = { id, kind:'mock', org, name:F.name.trim(), date:F.date, e:{raw:num(F.er), std:num(F.es), pct:num(F.ep)}, c:{raw:num(F.cr), std:num(F.cs), pct:num(F.cp)} };
    if(rec.e.std==null && rec.e.raw==null && rec.c.std==null && rec.c.raw==null){ alert('점수를 하나 이상 입력해 주세요'); return; }
  }
  S.leet.recs = recs().concat([rec]); touch();
  LV.mode = F.kind==='past' ? 'past' : LV.mode==='past' ? 'org' : LV.mode;
  Object.assign(LF, { round:'', e:'', c:'', name:'', er:'', es:'', ep:'', cr:'', cs:'', cp:'' });
  document.body.classList.remove('lf-open'); renderLeet(); }

</script>
</body>
