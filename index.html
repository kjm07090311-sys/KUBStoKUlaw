<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8B0029">
<meta name="description" content="고려대학교 26학번 경영학과 + 공공거버넌스와 리더십 융합전공 졸업요건 트래커">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="고경고로">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./favicon.ico" sizes="any">
<title>고경에서 고로까지 · 26학번 경영학과 + 공공거버넌스와 리더십</title>
<style>
:root{
  --crimson:#8B0029; --crimson-d:#5c001b; --crimson-l:#b3123f;
  --cream:#FBF6E9; --sand:#EFE2C6; --sand-d:#e2d0ab;
  --ink:#241014; --mut:#7a6a63;
  --ok:#2e7d4f; --warn:#c98a00; --bad:#b83232;
  --card:#fff; --line:#e6dcc6;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--cream);color:var(--ink);}
header{background:linear-gradient(180deg,#96072F 0%,var(--crimson) 55%,#7A0024 100%);color:#fff;padding:30px 22px 28px;text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:0;width:100%;max-width:740px;margin:0 auto}
.hd .mid{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}
.hd .tiger{height:76px;width:auto;margin-bottom:9px;filter:drop-shadow(0 3px 7px rgba(0,0,0,.3))}
.hd .crest{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-bottom:22px}
.hd .crest img{height:104px;width:auto;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
header h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.8px;text-shadow:0 2px 5px rgba(0,0,0,.25)}
@media(max-width:860px){.hd{gap:0}.hd .crest{display:none}header h1{font-size:22px}}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sand);border:1px solid var(--sand-d);border-radius:12px;padding:10px 12px;margin-bottom:18px}
.bar .sp{flex:1}
button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--sand-d);background:#fff;padding:7px 13px;transition:.12s}
button:hover{background:#f6efdd}
button.p{background:var(--crimson);color:#fff;border-color:var(--crimson)}
button.p:hover{background:var(--crimson-l)}
button.gh{background:transparent;border-color:transparent;color:var(--crimson);padding:6px 8px}
h2{font-size:16px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2 .n{font-size:12px;font-weight:400;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;font-weight:600;color:var(--mut)}
.tabs button.on{background:var(--crimson);color:#fff;border-color:var(--crimson)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px}
.card .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .t b{font-size:14px}
.card .t span{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pb{height:9px;border-radius:99px;background:#eee7d5;margin:10px 0 8px;overflow:hidden}
.pb i{display:block;height:100%;border-radius:99px;background:var(--crimson);transition:width .35s}
.card.done .pb i{background:var(--ok)}
.card.done .t span{color:var(--ok)}
.sub{font-size:12px;color:var(--mut);line-height:1.65}
.chk{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chk em{font-style:normal;font-size:11px;padding:3px 7px;border-radius:6px;background:#f2ece0;color:var(--mut);border:1px solid var(--line);cursor:pointer;transition:.12s}
.chk em:hover{background:#eadfca;color:var(--crimson)}
.chk em.y{background:#e4f3ea;color:var(--ok);border-color:#bfe3ce;font-weight:600}
.big{background:var(--crimson);color:#fff;border:none}
.big .sub{color:#f0d9df}
.big .pb{background:rgba(255,255,255,.22)}
.big .pb i{background:#fff}
.big.done .pb i{background:#7ce0a5}
.big.done .t span{color:#7ce0a5}
.sem .h em.ss{font-style:normal;font-size:9.5px;background:#fde8ef;color:var(--crimson);border-radius:4px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.sems{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
.sem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}
.sem>.h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;margin-bottom:8px}
.sem>.h .m{font-size:11px;font-weight:500;color:var(--mut)}
.sem>.h .rt{display:flex;align-items:center;gap:6px}
.sem>.h .sx{border:none;background:transparent;color:#c9bcae;font-size:14px;line-height:1;cursor:pointer;padding:2px 3px;border-radius:5px}
.sem>.h .sx:hover{background:#fde8ef;color:var(--crimson)}
.co{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:8px;background:#faf7ef;margin-bottom:5px;font-size:12.5px}
.co .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co .bd{font-size:10px;padding:2px 5px;border-radius:5px;background:var(--sand);color:var(--crimson-d);white-space:nowrap}
.co .bd.e{background:#dfe9f7;color:#1e4b86}
.co .gr{font-weight:700;font-variant-numeric:tabular-nums;color:var(--crimson)}
.co .x{border:none;background:none;color:#c3b6a6;padding:0 2px;font-size:15px}
.co .x:hover{color:var(--bad)}
.add{width:100%;border-style:dashed;color:var(--mut);margin-top:4px}
dialog{border:none;border-radius:16px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(30,10,15,.45)}
dialog:not([open]){display:none!important}
.dh{background:var(--crimson);color:#fff;padding:14px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.db{padding:16px 18px 18px}
input,select{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
.row{display:flex;gap:8px;margin-top:9px}
.row>*{flex:1}
label{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px}
.res{max-height:210px;overflow:auto;margin-top:9px;border:1px solid var(--line);border-radius:9px}
.res div{padding:8px 11px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #f2ece0}
.res div:hover{background:#faf3e4}
.res div small{color:var(--mut);font-size:11px}
.res div .tg{margin-left:auto;font-size:10px;background:var(--sand);padding:2px 6px;border-radius:5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.st b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.st span{font-size:11.5px;color:var(--mut)}
.st.gp{background:linear-gradient(180deg,#fff,#fdf7ef)}
.st.gp b{color:var(--crimson)}
.st.gp span{display:block;font-weight:600;color:#5c4a3d}
.st em{display:block;margin-top:2px;font-style:normal;font-size:10px;color:#a99b8d}
.st.cv b i{font-style:normal;font-size:12px;color:#a99b8d;font-weight:600;margin-left:2px}
/* 성적 추이 탭 */
.chart{width:100%;overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.chart svg{display:block;max-width:100%;height:auto;min-width:320px}
.lgd{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:11.5px;color:var(--mut)}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd .ln{width:16px;height:3px;border-radius:2px;display:inline-block}
.lgd .ln.dash{background:repeating-linear-gradient(90deg,#c98a00 0 5px,transparent 5px 9px)!important}
.lgd .bx{width:11px;height:11px;border-radius:2px;background:var(--sand);display:inline-block}
.gtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px;font-variant-numeric:tabular-nums}
.gtab th{font-size:11px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.gtab th:first-child{text-align:left}
.gtab td{padding:7px 4px;border-bottom:1px solid #f2ece0;text-align:right}
.gtab td.l{text-align:left;font-weight:600}
.gtab td.b{font-weight:700;color:var(--crimson)}
.gtab td.up{color:var(--ok);font-weight:600}
.gtab td.dn{color:var(--bad);font-weight:600}
.gtab tr:last-child td{border-bottom:none}
.note{font-size:11.5px;color:var(--mut);background:#fff8e6;border:1px solid #f0e2b8;border-radius:9px;padding:9px 12px;margin-top:10px;line-height:1.6}
.empty{font-size:12px;color:#bcaea0;text-align:center;padding:8px 0}
details.pool{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
details.pool>summary{cursor:pointer;font-size:12px;color:var(--crimson);font-weight:600;list-style:none;display:flex;align-items:center;gap:5px;user-select:none}
details.pool>summary::-webkit-details-marker{display:none}
details.pool>summary::before{content:'▸';font-size:10px;transition:.15s}
details[open].pool>summary::before{content:'▾'}
.plist{margin-top:8px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.plist .pi{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:11.5px;border-bottom:1px solid #f4efe3;line-height:1.35;cursor:pointer}
.plist .pi:hover{background:#faf3e4}
.plist .pi:last-child{border-bottom:none}
.plist .pi small{color:#a99b8d;font-size:10px;flex:0 0 62px;font-variant-numeric:tabular-nums}
.plist .pi .pn{flex:1;min-width:0}
.plist .pi.y{background:#f0f9f3;color:var(--ok);font-weight:600}
.plist .pi.y small{color:#63a97f}
.plist .pi .mk{flex:0 0 auto;font-size:10px}
.plist .pi .dl{flex:0 0 auto;font-size:9.5px;background:#fde8ef;color:var(--crimson);border-radius:4px;padding:1px 4px}
.big details.pool>summary{color:#ffd9e2}
.big details.pool{border-top-color:rgba(255,255,255,.28)}

/* ═══════════ 웹/모바일 레이어 ═══════════ */
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:rgba(139,0,41,.12);overscroll-behavior-y:none}
header{padding-top:calc(30px + env(safe-area-inset-top))}

/* ── 접근키 로그인 화면 ── */
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(165deg,#96072F 0%,#5c001b 100%);
  display:flex;align-items:center;justify-content:center;padding:22px;
  padding-top:calc(22px + env(safe-area-inset-top));padding-bottom:calc(22px + env(safe-area-inset-bottom))}
#lock.off{display:none}
#lock .box{background:#fff;border-radius:20px;padding:28px 22px 24px;width:100%;max-width:390px;
  box-shadow:0 26px 70px rgba(0,0,0,.45);text-align:center}
#lock .ic{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 12px;box-shadow:0 6px 18px rgba(139,0,41,.28)}
#lock h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.6px;color:var(--crimson)}
#lock p.s{margin:6px 0 0;font-size:12px;color:var(--mut);line-height:1.6}
#lock input{margin-top:18px;text-align:center;font-size:16px;letter-spacing:1.2px;text-transform:uppercase;
  padding:14px 12px;border:1.5px solid var(--sand-d);border-radius:11px;font-variant-numeric:tabular-nums}
#lock input:focus{outline:none;border-color:var(--crimson)}
#lock button.go{width:100%;margin-top:10px;padding:14px;font-weight:700;font-size:15px;
  background:var(--crimson);color:#fff;border-color:var(--crimson)}
#lock button.go:hover{background:var(--crimson-l)}
#lock button.go:disabled{opacity:.6;cursor:default}
#lock .msg{min-height:19px;margin-top:11px;font-size:12.5px;color:var(--mut);line-height:1.5}
#lock .msg.err{color:var(--bad);font-weight:600}
#lock .msg.ok{color:var(--ok);font-weight:600}
#lock .hint{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:11px;color:#a99b8d;line-height:1.7;text-align:left}
#lock .hint b{color:var(--mut)}

/* ── 동기화 표시 ── */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;white-space:nowrap;
  padding:6px 11px;border-radius:99px;background:#fff;border:1px solid var(--sand-d);color:var(--mut)}
.sync i{width:7px;height:7px;border-radius:99px;background:#c3b6a6;flex:0 0 auto}
.sync.ok i{background:var(--ok)}
.sync.busy i{background:var(--warn);animation:bl 1s infinite}
.sync.err i{background:var(--bad)}
@keyframes bl{50%{opacity:.25}}
.who{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}

/* ── 터치 최적화 ── */
@media(hover:none){
  button:hover{background:#fff}
  button.p:hover{background:var(--crimson)}
}
@media(max-width:760px){
  .wrap{padding:14px 12px calc(86px + env(safe-area-inset-bottom))}
  header{padding:22px 14px 20px;padding-top:calc(22px + env(safe-area-inset-top))}
  .hd .tiger{height:60px;margin-bottom:7px}
  header h1{font-size:21px}

  button{min-height:44px;padding:10px 14px;font-size:13.5px}
  button.gh{min-height:40px}
  .bar{gap:7px;padding:9px 10px;margin-bottom:14px}
  .bar .sp{display:none}
  .bar button{flex:1 1 auto}
  .sync{flex:1 1 100%;justify-content:center;min-height:34px}

  .stats{grid-template-columns:repeat(2,1fr);gap:8px}
  .st b{font-size:19px}
  .grid,.sems{grid-template-columns:1fr;gap:10px}

  /* 하단 고정 탭바 */
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;margin:0;gap:0;
    background:rgba(255,255,255,.97);backdrop-filter:blur(8px);
    border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(0,0,0,.07);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{flex:1;border:none;background:transparent;border-radius:10px;
    padding:9px 4px;font-size:11.5px;line-height:1.35;font-weight:700;min-height:48px;
    white-space:normal;word-break:keep-all}
  .tabs button.on{background:var(--crimson);color:#fff}

  /* 과목 줄 — 이름 줄바꿈 + 큰 터치영역 */
  .co{padding:10px 9px;font-size:13px;flex-wrap:wrap;gap:6px}
  .co .nm{white-space:normal;overflow:visible;text-overflow:clip;word-break:keep-all;flex:1 1 auto;min-width:120px}
  .co .x{padding:4px 8px;font-size:19px;margin-left:auto}
  .chk em{padding:7px 10px;font-size:11.5px}
  .plist{max-height:44vh}
  .plist .pi{padding:9px 9px;font-size:12px}
  details.pool>summary{padding:6px 0}

  /* 다이얼로그 = 하단 시트 */
  dialog{width:100%;max-width:none;margin:0;margin-top:auto;border-radius:18px 18px 0 0;
    max-height:92vh}
  dialog[open]{display:flex;flex-direction:column}
  .dh{position:sticky;top:0;z-index:2;flex:0 0 auto}
  .db{overflow:auto;-webkit-overflow-scrolling:touch;
    padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .res{max-height:38vh}
  .res div{padding:11px}
  input,select{font-size:16px;padding:11px}  /* iOS 자동 확대 방지 */
  .row{flex-wrap:wrap}
  .row>*{min-width:calc(50% - 4px)}
  .chart svg{min-width:300px}
}
@media(max-width:400px){
  .stats{grid-template-columns:1fr 1fr}
  .tabs button{font-size:10.5px}
}
@media(min-width:761px){
  dialog{max-height:88vh}
  dialog[open]{display:flex;flex-direction:column}
  .db{overflow:auto}
}
@media print{#lock,.bar,.tabs{display:none}}
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <img class="ic" src="./icon-192.png" alt="">
    <h1>고경에서 고로까지</h1>
    <p class="s">고려대학교 졸업요건 트래커<br>발급받은 접근키를 입력해 주세요</p>
    <input id="lkey" type="text" inputmode="latin" autocapitalize="characters" autocomplete="off"
           spellcheck="false" placeholder="GOGYEONG-XXXX-XXXX" maxlength="24">
    <button class="go" id="lgo" onclick="doLogin()">시작하기</button>
    <div class="msg" id="lmsg"></div>
    <div class="hint">
      <b>접근키란?</b> 키 하나가 곧 내 계정입니다. 같은 키로 로그인하면
      휴대폰·태블릿·노트북 어디서든 같은 기록을 볼 수 있어요.<br>
      비밀번호가 없으니 <b>키를 남과 공유하지 마세요.</b>
    </div>
  </div>
</div>

  if(!CLOUD || !KEY){ if(KEY) setSync('off','이 기기에만 저장'); return; }
  syncDirty = true;
  setSync('busy','저장 중…');
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushCloud, 1200);
}
async function pushCloud(){
  if(!CLOUD || !KEY || !syncDirty) return;
  try{
    const r = await rpc('kg_save', { p_key: KEY, p_data: { sems:S.sems, courses:S.courses, ts: Date.now() } });
    if(r && r.ok){ syncDirty = false; setSync('ok','저장됨'); }
    else setSync('err','키를 사용할 수 없습니다');
  }catch(e){ setSync('err','오프라인 · 이 기기에만 저장됨'); }
}
window.addEventListener('online',  ()=>{ if(syncDirty) pushCloud(); });
window.addEventListener('beforeunload', e=>{ if(syncDirty){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', ()=>{ if(document.hidden && syncDirty) pushCloud(); });

/* ── 로그인 화면 ── */
function lockMsg(t, cls){
  const e = document.getElementById('lmsg');
  if(e){ e.className = 'msg ' + (cls||''); e.textContent = t; }
}
function unlock(){
  const e = document.getElementById('lock');
  if(e) e.classList.add('off');
}
function useData(d){
  if(d && Array.isArray(d.sems) && Array.isArray(d.courses)){
    S.sems = d.sems; S.courses = d.courses;
  }
}
function logout(){
  if(syncDirty){ pushCloud(); }
  if(!confirm('다른 접근키로 여시겠어요?\n(이 기기에 저장된 내용은 그대로 남아 있습니다)')) return;
  localStorage.removeItem(LS_LAST);
  location.reload();
}

async function doLogin(silentKey){
  const inp = document.getElementById('lkey');
  const btn = document.getElementById('lgo');
  const raw = (silentKey || (inp ? inp.value : '')).trim().toUpperCase();
  if(!raw){ lockMsg('접근키를 입력해 주세요', 'err'); return; }

  const finishOffline = (note)=>{
    KEY = raw;
    try{ localStorage.setItem(LS_LAST, KEY); }catch(e){}
    useData(load());
    unlock(); render();
    setSync('off', note);
  };

  if(!CLOUD){ finishOffline('이 기기에만 저장'); return; }

  if(btn) btn.disabled = true;
  lockMsg('확인 중…', '');
  try{
    const r = await rpc('kg_login', { p_key: raw });
    if(!r || !r.ok){
      lockMsg('사용할 수 없는 접근키입니다. 다시 확인해 주세요.', 'err');
      try{ localStorage.removeItem(LS_LAST); }catch(e){}
      if(btn) btn.disabled = false;
      return;
    }
    KEY = raw;
    try{ localStorage.setItem(LS_LAST, KEY); }catch(e){}

    const remote = (r.data && (Array.isArray(r.data.sems) || Array.isArray(r.data.courses))) ? r.data : null;
    const localD = load();
    const rTs = r.updated_at ? Date.parse(r.updated_at) : (remote && remote.ts ? remote.ts : 0);
    const lTs = (localD && localD.ts) ? localD.ts : 0;

    let pushAfter = false;
    if(remote && (!localD || lTs <= rTs + 1000)){ useData(remote); }
    else if(localD){ useData(localD); pushAfter = !!localD.courses; }

    unlock(); render();
    setSync('ok','저장됨');
    if(pushAfter){ syncDirty = true; pushCloud(); }
  }catch(e){
    finishOffline('오프라인 · 이 기기에만 저장됨');
    lockMsg('', '');
  }finally{
    if(btn) btn.disabled = false;
  }
}

function initAuth(){
  const inp = document.getElementById('lkey');
  if(inp){
    inp.addEventListener('keydown', e=>{ if(e.key === 'Enter') doLogin(); });
    inp.addEventListener('input', ()=> lockMsg('', ''));
  }
  let last = null;
  try{ last = localStorage.getItem(LS_LAST); }catch(e){}
  if(last){
    if(inp) inp.value = last;
    doLogin(last);
  }else if(inp){
    setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 120);
  }
}

/* ═══════════ 3. 상태 ═══════════ */
let S = load() || {
  sems:["1-1","1-2","2-1","2-2","3-1","3-2","4-1","4-2"],
  courses:[], tab:1, editing:null
};
let tab = 1;
const dlg = document.getElementById('dlg');

function save(){ try{ localStorage.setItem(lsKey(), JSON.stringify({sems:S.sems,courses:S.courses,ts:Date.now()})); }catch(e){} queueSync(); }
function load(){ try{ const r=localStorage.getItem(lsKey()); if(!r) return null; const o=JSON.parse(r); return {sems:o.sems,courses:o.courses,ts:o.ts||0}; }catch(e){ return null; } }

/* ═══════════ 4. 계산 ═══════════ */
function taken(){ return S.courses.filter(c=>c.gr!=="수강중" && c.gr!=="F"); }
function hasCode(code){ return taken().some(c=>c.code===code); }
function totalCredits(){ return taken().reduce((s,c)=>s+crOf(c),0); }

/* ── 평점 계산 ────────────────────────────────────────────────
   · P / 수강중 / NP 등 평점 없는 과목은 분자·분모 모두 제외
   · F 는 0.0 으로 분모에 포함 (성적경고 기준과 동일)
   · 학점이 비었거나 숫자가 아니면 제외 (NaN 방지)
   · 같은 과목을 재수강한 경우 마지막(늦은 학기) 성적만 반영     */
function gradedCourses(list){
  const src = (list||S.courses).filter(c=>{ const g=gp(c.gr); return g!==null && g!==undefined && crOf(c)>0; });
  const best = {};
  src.forEach(c=>{
    const key = (c.code||'').trim().toUpperCase() || ('#'+(c.name||'').trim());
    const prev = best[key];
    if(!prev || semIdx(c.sem) >= semIdx(prev.sem)) best[key] = c;
  });
  return Object.values(best);
}
function avgOf(filterFn){
  const list = gradedCourses().filter(filterFn||(()=>true));
  let p=0, t=0;
  list.forEach(c=>{ const v=crOf(c); p += gp(c.gr)*v; t += v; });
  return { avg: t? p/t : 0, cr: t, n: list.length };
}
/* 전공 = 제1전공(전공필수·전공선택) + 융합전공 을 합쳐 하나로. 학문의기초는 전공 아님 */
const MAJOR_GPA_CATS = ["전공필수","전공선택","융전-전공필수","융전-1영역","융전-2영역","융전-3영역"];
const LIB_GPA_CATS   = ["교양필수","핵심교양","교양선택","학문의기초","융전-교양선택필수"];
// ── 학점 환산표 (4.5 만점 기준) ───────────────────────────
//   100점 만점 = 평점 × 10 + 60   (4.00 이상은 100점)
//   4.3 만점  = 평점 + 0.3        (4.00 이상은 4.30)
//   4.0 만점  = 평점 + 0.5        (3.50 이상은 4.00)
function to100(v){ return Math.min(100, v*10 + 60); }
function to43(v){  return Math.min(4.3, v + 0.3); }
function to40(v){  return Math.min(4.0, v + 0.5); }
function gpa(){      return avgOf(null).avg; }
function gpaMajor(){ return avgOf(c=>MAJOR_GPA_CATS.includes(c.cat)); }
function gpaLib(){   return avgOf(c=>LIB_GPA_CATS.includes(c.cat)); }
/* ── 학기별 성적 ────────────────────────────────────────────
   · 학기 평점 : 그 학기 과목만으로 계산 (재수강도 그 학기 성적 그대로)
   · 누적 평점 : 그 학기까지의 전체 과목, 재수강은 마지막 성적만 반영
   · 취득학점 : F·수강중 제외한 실제 취득 학점                   */
function semStats(){
  return sortedSems().map(sm=>{
    const idx   = semIdx(sm);
    const inSem = S.courses.filter(c=>c.sem===sm);
    let p=0, t=0;
    inSem.forEach(c=>{
      const g=gp(c.gr), v=crOf(c);
      if(g!==null && g!==undefined && v>0){ p+=g*v; t+=v; }
    });
    let cp=0, ct=0;
    gradedCourses(S.courses.filter(c=>semIdx(c.sem)<=idx)).forEach(c=>{
      const v=crOf(c); cp += gp(c.gr)*v; ct += v;
    });
    return {
      sem: sm, label: semLabel(sm), n: inSem.length,
      gpa: t? p/t : null, gpaCr: t,
      cum: ct? cp/ct : null,
      enrolled: inSem.reduce((a,c)=>a+crOf(c),0),
      earned:   inSem.filter(c=>c.gr!=="수강중" && c.gr!=="F").reduce((a,c)=>a+crOf(c),0)
    };
  });
}

/* 영어강의 8과목: 학수번호가 BUSS로 시작하는 강의만 인정 */
function engCount(){ return taken().filter(c=>c.eng && /^BUSS/i.test(c.code||'')).length; }

/* ── 중복인정(제1전공 ↔ 융합전공) ────────────────────────────
   · 규정 한도: 최대 6학점
   · 융합전공 이수학점 중 30학점을 초과하는 학점만 중복인정 가능
     → 실제 한도 = min(6, 융합전공 이수학점 − 30)
   · 융합전공 이수학점은 "어느 카테고리로 등록했든" 융합전공 인정과목이면
     모두 합산한다. (경영 쪽으로 등록했다고 융전 학점이 사라지면
     한도가 영원히 0이 되는 순환 문제가 생기기 때문)
   · 먼저 들은(학기가 빠른) 과목부터 우선 중복인정
   · 아직 30학점을 넘지 못했어도, 36학점 달성 시 어떤 과목이 인정될지
     미리 보여준다(예정 목록)                                      */
const BIZ_ALT_SET = new Set(BIZ_ALT.map(x=>x[0]));
const BIZ_SEL_SET = new Set(BIZ.filter(c=>c.cat==="전공선택").map(c=>c.code).concat(BIZ_ALT.map(x=>x[0])));

function convCatOf(code){
  for(const k in CONV_POOL) if(CONV_POOL[k].some(x=>x[0]===code)) return k;
  return null;
}
const TERM_ORD = {"1":1,"S":2,"2":3,"W":4};
const TERM_LBL = {"1":"1학기","S":"여름계절","2":"2학기","W":"겨울계절"};
function semIdx(s){
  const a=String(s||'9-9').split('-');
  const y=Number(a[0])||9, t=TERM_ORD[String(a[1]||'').toUpperCase()]||9;
  return y*10+t;
}
function semLabel(s){
  const a=String(s||'').split('-');
  return (a[0]||'?')+'학년 '+(TERM_LBL[String(a[1]||'').toUpperCase()]||a[1]||'');
}
function isConvCat(cat){ return /^융전-/.test(cat); }

const DUAL_CAP = 6;     // 규정상 제1전공 ↔ 융합전공 중복인정 한도

/* 융합전공 이수학점 — 등록 카테고리와 무관하게 융전 인정과목이면 모두 합산
   (같은 학수번호를 두 번 등록해도 한 번만 센다)                  */
function convRaw(){
  const seen = new Set(); let sum = 0;
  taken().forEach(c=>{
    if(!convCatOf(c.code)) return;
    const k = String(c.code||'').toUpperCase();
    if(seen.has(k)) return;
    seen.add(k); sum += crOf(c);
  });
  return sum;
}
/* 중복인정 한도는 항상 6학점.
   (규정상 "융전 30학점 초과분"이지만, 이수 중에도 반영 상태를 볼 수 있도록
    6학점을 먼저 적용하고 확정 여부는 안내 문구로 표시한다)            */
function dualCap(){ return DUAL_CAP; }

/* 학수번호가 제1전공(경영) 교과목이기도 한지 → 그 과목의 경영 쪽 영역 반환 */
function bizHome(code){
  const d = DB.find(x=>x.code===code);
  if(!d) return null;
  if(d.bizAlt) return "전공선택";
  return BIZ_CATS.includes(d.cat) ? d.cat : null;
}

/* 양쪽 모두에 속하는 과목 = 중복인정 후보 (학기 빠른 순, 학수번호 중복 제거) */
function dualCandidates(){
  const seen = new Set();
  return taken().filter(c=>{
    if(!convCatOf(c.code) || !bizHome(c.code)) return false;
    const k = String(c.code||'').toUpperCase();
    if(seen.has(k)) return false;
    seen.add(k); return true;
  }).sort((a,b)=> semIdx(a.sem)-semIdx(b.sem) || String(a.id).localeCompare(String(b.id)));
}
function allocate(list, cap){
  const map={}; let left=cap;
  list.forEach(c=>{ const v=crOf(c); if(v>0 && left>=v){ map[c.id]=true; left-=v; } });
  return {map, used:cap-left};
}
function dualInfo(){
  const cap  = dualCap();
  const list = dualCandidates();
  const A    = allocate(list, cap);
  const P    = allocate(list, DUAL_CAP);   // 융전 36학점 달성 시 예상 배정
  return {cap, used:A.used, map:A.map, list,
          applied: list.filter(c=>A.map[c.id]),
          preview: list.filter(c=>P.map[c.id]),
          previewUsed: P.used, raw: convRaw()};
}

/* 제1전공 학점 — 융전으로 등록한 과목도 중복인정 배정되면 원래 경영 영역으로 가산 */
function creditsIn(cats){
  const D = dualInfo();
  let sum = 0;
  taken().forEach(c=>{
    if(cats.includes(c.cat)){ sum += crOf(c); return; }
    if(isConvCat(c.cat) && D.map[c.id]){
      const home = bizHome(c.code);
      if(home && cats.includes(home)) sum += crOf(c);
    }
  });
  return sum;
}

/* 융합전공 영역별 이수과목 — 등록 카테고리와 무관하게 학수번호로 판정.
   (경영 쪽 영역으로 등록해 두어도 융합전공 이수 현황에는 그대로 반영된다) */
function convTaken(cat){
  const pool = new Set(CONV_POOL[cat].map(x=>x[0]));
  const seen = new Set(), out = [];
  taken().forEach(c=>{
    const k = String(c.code||'').toUpperCase();
    if(!pool.has(c.code) || seen.has(k)) return;
    seen.add(k); out.push(c);
  });
  return out;
}
function convCredits(cat){ return convTaken(cat).reduce((s,c)=>s+crOf(c),0); }
function convCount(cat){ return convTaken(cat).length; }

/* ═══════════ 5. 렌더 ═══════════ */
function bar(label, got, need, extra, done){
  const pct = need? Math.min(100, got/need*100) : 0;
  const ok = done!==undefined ? done : got>=need;
  return `<div class="card ${ok?'done':''}">
    <div class="t"><b>${label}</b><span>${fmt(got)} / ${need}</span></div>
    <div class="pb"><i style="width:${pct}%"></i></div>
    ${extra||''}</div>`;
}
function fmt(n){ return Number.isInteger(n)? n : n.toFixed(1); }
function chips(list, has){
  return `<div class="chk">${list.map(([c,n])=>`<em class="${has(c)?'y':''}" onclick="openSearchFor('${c}')" title="이 과목 검색하기">${has(c)?'✓ ':''}${n}</em>`).join('')}</div>`;
}

const POOL_OPEN = new Set();
function poolToggle(d){ if(d.open) POOL_OPEN.add(d.dataset.k); else POOL_OPEN.delete(d.dataset.k); }
function poolList(title, arr){
  const D = dualInfo();
  const dualCodes = new Set(D.applied.map(c=>c.code));
  const items = arr.map(([code,name])=>{
    const got  = hasCode(code);
    const dual = dualCodes.has(code);
    return `<div class="pi ${got?'y':''}" onclick="openSearchFor('${code}')" title="이 과목 검색하기">
      <small>${code}</small>
      <span class="pn">${name}</span>
      ${dual?'<span class="dl">중복인정</span>':''}
      <span class="mk">${got?'✓':''}</span>
    </div>`;
  }).join('');
  const n = arr.filter(([c])=>hasCode(c)).length;
  return `<details class="pool" data-k="${title}" ${POOL_OPEN.has(title)?'open':''} ontoggle="poolToggle(this)">
    <summary>${title} (${arr.length}과목 · 이수 ${n})</summary>
    <div class="plist">${items}</div></details>`;
}
function bizSelPool(){
  const a = BIZ.filter(c=>c.cat==="전공선택").map(c=>[c.code, c.name + (c.eng?' 🅔':'')]);
  const b = BIZ_ALT.map(x=>[x[0], x[1]+' (타학과 인정)']);
  return a.concat(b);
}

function renderDash(){
  const el = document.getElementById('dash');
  const nt = document.getElementById('dashnote');
  const D  = dualInfo();
  const rawConv = convRaw();
  const dualLine = D.applied.length
    ? `중복인정 ${fmt(D.used)}/6학점 적용 — ${D.applied.map(c=>c.name).join(', ')}`
      + (rawConv>30 ? ' (확정)' : ` · 융합전공 ${fmt(rawConv)}학점 → 30학점 초과 시 확정`)
    : `중복인정 0/6학점 — 제1전공과 융합전공 양쪽에 모두 해당하는 과목을 이수하면 자동 반영됩니다 (현재 융합전공 ${fmt(rawConv)}학점)`;

  if(tab===1){
    const basic = creditsIn(["학문의기초"]);
    const gen   = creditsIn(["교양필수"]);

    const req   = creditsIn(["전공필수"]);
    const sel   = creditsIn(["전공선택"]);
    const tot   = totalCredits();
    const eng   = engCount();
    el.innerHTML =
      `<div class="card big ${tot>=130?'done':''}">
        <div class="t"><b>총 졸업학점</b><span>${fmt(tot)} / 130</span></div>
        <div class="pb"><i style="width:${Math.min(100,tot/130*100)}%"></i></div>
        <div class="sub">평점평균 ${gpa().toFixed(2)} (기준 1.75 이상) · 영어강의(BUSS) ${eng}/8과목</div></div>`
      + bar("필수교양 (교양필수)", gen, genNeed,
          `<div class="sub">아래 교양필수 과목 이수 여부</div>` +
          chips(GEN_REQ.map(g=>[g[0],g[1]]), hasCode),
          GEN_REQ.every(g=>hasCode(g[0])))
      + bar("학문의기초", basic, 12,
          chips(BASIC_REQ.map(c=>[c, nameOf(c)]), hasCode),
          BASIC_REQ.every(hasCode))
      + bar("전공필수", req, 24,
          chips(MAJOR_REQ.map(c=>[c, nameOf(c)]), hasCode),
          MAJOR_REQ.every(hasCode))
      + bar("전공선택", sel, 15,
          `<div class="sub">BUSS 전공선택 + 타학과 전공선택 인정과목<br>${dualLine}</div>`
          + poolList("전공선택 인정과목 보기", bizSelPool()))
      + bar("경제학 필수과목", econ, 6,
          chips(ECON_REQ.map(c=>[c, nameOf(c)]), hasCode),
          ECON_REQ.every(hasCode))
      + bar("영어강의 (BUSS 과목 수)", eng, 8,
          `<div class="sub">학수번호가 <b>BUSS</b>로 시작하는 영어강의만 인정</div>`
          + poolList("BUSS 영어강의 개설과목 보기", BIZ.filter(c=>c.eng).map(c=>[c.code,c.name])));
    nt.innerHTML = `<div class="note">※ 26학번 경영학과 제1전공 기준: 학문의기초 12 · 경제학 필수 6 · 제1전공 39(전공필수 24 + 전공선택 15) · 총 130학점 · 평점평균 1.75 이상 · <b>영어강의 8과목(BUSS 학수번호 한정)</b>.<br>
      ※ 제1전공과 융합전공은 <b>최대 6학점까지 중복인정</b>되며, 융합전공 이수학점 중 <b>30학점을 초과하는 학점</b>에 한해 적용됩니다(36학점 달성 시 6학점 전부). 먼저 들은 과목부터 자동 배정됩니다.<br>
      교양필수 과목별 학점은 학교 공지에 따라 달라질 수 있으니 과목 추가 시 실제 학점으로 수정하세요.</div>`;
  } else if(tab===2){
    const nec = convCredits("융전-전공필수");
    const lib = convCredits("융전-교양선택필수");

    const n1 = convCount("융전-1영역"), n2 = convCount("융전-2영역"), n3 = convCount("융전-3영역");
    const selTot = a1+a2+a3, selCnt = n1+n2+n3;
    const areasOK = a1>=6 && a2>=6 && a3>=6;
    const selOK   = selTot>=24 && selCnt>=8 && areasOK;
    const convTot = nec + Math.min(lib,3) + selTot;
    const req3 = CONV_POOL["융전-전공필수"];
    const areaBar = (t,got,cnt,key) => bar(t, got, 6,
      `<div class="sub">${cnt}과목 이수 · <b>각 영역 최소 6학점(2과목)</b> 필수</div>`
      + poolList("이 영역 과목 보기", CONV_POOL[key]), got>=6 && cnt>=2);
    el.innerHTML =
      `<div class="card big ${convTot>=36?'done':''}">
        <div class="t"><b>총 이수학점</b><span>${fmt(convTot)} / 36</span></div>
        <div class="pb"><i style="width:${Math.min(100,convTot/36*100)}%"></i></div>
        <div class="sub">전공필수 9 + 교양선택필수 3 + 전공선택 24 · ${dualLine}</div></div>`
      + bar("전공필수 (법학)", nec, 9, chips(req3, hasCode), req3.every(x=>hasCode(x[0])))
      + bar("교양선택필수", Math.min(lib,3), 3,
          `<div class="sub">법학관련 핵심교양 / JURA 입문과목 중 1과목(3학점) 이상</div>`
          + poolList("인정과목 보기 (법학관련 핵심교양)", CONV_POOL["융전-교양선택필수"]))
      + bar("전공선택 합계", selTot, 24,
          `<div class="sub">${selCnt}과목 / 8과목 · ${selOK?'✅ 영역별 최소요건 충족':'⚠️ 1·2·3영역 각 6학점(2과목) 이상 필요'}</div>`
          + poolList("전공선택 전체 과목 보기", CONV_POOL["융전-1영역"].concat(CONV_POOL["융전-2영역"],CONV_POOL["융전-3영역"])), selOK)
      + areaBar("전공선택 1영역 (법학)", a1, n1, "융전-1영역")
      + areaBar("전공선택 2영역 (행정학)", a2, n2, "융전-2영역")
      + areaBar("전공선택 3영역 (경제학)", a3, n3, "융전-3영역");
    nt.innerHTML = `<div class="note">※ 2026학번~ 공공거버넌스와 리더십 융합전공: 총 36학점.<br>
      ※ <b>“전공선택 영역에서 24학점(8과목) 이상을 이수해야 함. 다만, 전공선택 1영역(법학), 2영역(행정학), 3영역(경제학)의 각 영역에서 각각 최소한 6학점(2과목) 이상을 이수해야 함.”</b><br>
      ※ <b>“자유전공학부 ‘공공거버넌스와리더십’ 융합전공의 이수학점 중에서 30학점을 초과하는 학점에 대해서는 제1전공 교과목과 중복 인정할 수 있다.”</b><br>
      → 중복인정 한도는 <b>최대 6학점</b>이며, 융합전공 이수학점이 <b>30학점을 초과한 만큼</b>만 인정됩니다. 즉 36학점을 채우면 6학점 전부 인정. 어느 카테고리로 등록했든 융합전공 인정과목이면 융합전공 이수학점에 합산되고, 먼저 들은 과목부터 자동 배정됩니다.<br>
      ※ 추가 졸업요건으로 <b>공인영어성적</b> 제출이 필요합니다 (TOEIC 750 / TOEFL iBT 80 / TEPS 285 / IELTS 6.0 / TOSEL(A) 620, 입학 후 취득).</div>`;
  } else {
    renderGpaTab(el, nt);

}

function renderGpaTab(el, nt){
  const rows = semStats().filter(r=>r.n>0);
  if(!rows.length){
    el.innerHTML = `<div class="card"><div class="t"><b>📈 성적 추이</b></div>
      <div class="sub" style="margin-top:8px">아직 등록된 과목이 없습니다. 과목을 추가하면 학기별 평점 그래프가 그려집니다.</div></div>`;
    nt.innerHTML = ''; return;
  }

  /* ── 좌표계 ── */
  const n=rows.length, step=Math.max(64, Math.min(110, 620/n)),
        padL=42, padR=42, padT=20, padB=48,
        W=Math.round(padL+padR+step*n), H=286, plotH=H-padT-padB;
  const maxCr = Math.max(21, ...rows.map(r=>r.earned));
  const x  = i => padL + step*i + step/2;
  const yG = v => padT + plotH*(1 - v/4.5);
  const yB = v => padT + plotH*(1 - v/maxCr);

  /* 가로 눈금 (평점) */
  let grid='';
  [0,1,2,3,4,4.5].forEach(v=>{
    const y=yG(v);
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#e6dcc6" stroke-width="1"${v===0?'':' stroke-dasharray="3 4"'}/>`
          + `<text x="${padL-8}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="#a99b8d">${v.toFixed(1)}</text>`;
  });

  /* 취득학점 막대 */
  const bw=Math.min(30, step*0.42);
  const bars = rows.map((r,i)=>{
    const h=Math.max(0, plotH*(r.earned/maxCr));
    return `<rect x="${x(i)-bw/2}" y="${yB(r.earned)}" width="${bw}" height="${h}" rx="3" fill="#EFE2C6"/>`
         + (r.earned? `<text x="${x(i)}" y="${yB(r.earned)-4}" text-anchor="middle" font-size="9.5" fill="#a99b8d">${fmt(r.earned)}</text>` : '');
  }).join('');

  /* 선 그래프 */
  const line = (key,color,dash) => {
    const pts = rows.map((r,i)=>r[key]==null?null:[x(i),yG(r[key])]).filter(Boolean);
    if(!pts.length) return '';
    const d = pts.map(p=>`${p[0]},${p[1]}`).join(' ');
    return `<polyline points="${d}" fill="none" stroke="${color}" stroke-width="2.2"
             stroke-linejoin="round" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}/>`
         + pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#fff" stroke="${color}" stroke-width="2.2"/>`).join('');
  };
  const labels = rows.map((r,i)=> r.gpa==null? '' :
    `<text x="${x(i)}" y="${yG(r.gpa)-11}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#8B0029">${r.gpa.toFixed(2)}</text>`).join('');

  /* x축 */
  const xs = rows.map((r,i)=>{
    const a=String(r.sem).split('-');
    const t={"1":"1학기","S":"여름","2":"2학기","W":"겨울"}[String(a[1]||'').toUpperCase()]||a[1];
    return `<text x="${x(i)}" y="${H-padB+17}" text-anchor="middle" font-size="10" fill="#7a6a63">${a[0]}-${t}</text>`;
  }).join('');

  const svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="학기별 평점 그래프">
    ${grid}${bars}
    ${line('cum','#c98a00','5 4')}
    ${line('gpa','#8B0029','')}
    ${labels}${xs}
    <line x1="${padL}" y1="${padT+plotH}" x2="${W-padR}" y2="${padT+plotH}" stroke="#d9cbb0" stroke-width="1.2"/>
  </svg>`;

  const last = rows[rows.length-1];
  const withG = rows.filter(r=>r.gpa!=null);
  const best  = withG.length? withG.reduce((a,b)=>b.gpa>a.gpa?b:a) : null;

  /* 표 */
  const tbl = `<table class="gtab"><thead><tr>
      <th>학기</th><th>신청</th><th>취득</th><th>학기 평점</th><th>누적 평점</th><th>증감</th></tr></thead><tbody>`
    + rows.map((r,i)=>{
        const prev = i>0? rows[i-1].gpa : null;
        const dv   = (r.gpa!=null && prev!=null)? r.gpa-prev : null;
        const dcls = dv==null? '' : (dv>0.001?'up':(dv<-0.001?'dn':''));
        const dtxt = dv==null? '–' : (dv>0.001?'▲ ':(dv<-0.001?'▼ ':'— '))+Math.abs(dv).toFixed(2);
        return `<tr><td class="l">${r.label}</td><td>${fmt(r.enrolled)}</td><td>${fmt(r.earned)}</td>
          <td class="b">${r.gpa!=null? r.gpa.toFixed(2):'–'}</td>
          <td>${r.cum!=null? r.cum.toFixed(2):'–'}</td>
          <td class="${dcls}">${dv==null?'–':dtxt}</td></tr>`;
      }).join('')
    + `</tbody></table>`;

  el.innerHTML =
    `<div class="card big">
      <div class="t"><b>📈 학기별 성적 추이</b><span>누적 ${last.cum!=null? last.cum.toFixed(2):'–'}</span></div>
      <div class="sub">총 ${rows.length}개 학기 · 취득 ${fmt(rows.reduce((a,r)=>a+r.earned,0))}학점`
      + (best? ` · 최고 학기 ${best.label} (${best.gpa.toFixed(2)})` : '') + `</div>
      <div class="lgd">
        <span><i class="ln" style="background:#8B0029"></i>학기 평점</span>
        <span><i class="ln dash" style="background:#c98a00"></i>누적 평점</span>
        <span><i class="bx"></i>취득학점</span>
      </div>
      <div class="chart">${svg}</div>
    </div>
    <div class="card"><div class="t"><b>학기별 상세</b></div>${tbl}</div>`;

  nt.innerHTML = `<div class="note">
    ※ <b>학기 평점</b>은 그 학기에 들은 과목만으로, <b>누적 평점</b>은 그 학기까지의 전체 과목으로 계산합니다. 재수강한 과목은 누적 평점에서 마지막 학기 성적만 반영됩니다.<br>
    ※ P(Pass)·수강중 과목은 평점 계산에서 제외되고, F는 0.0으로 분모에 포함됩니다.<br>
    ※ 막대는 그 학기 <b>취득학점</b>(F·수강중 제외)입니다.</div>`;
}

function nameOf(code){ const d=DB.find(x=>x.code===code); return d? d.name : code; }

function renderStats(){
  const all = avgOf(null), maj = gpaMajor(), lib = gpaLib();
  const gcard = (label, o, hint) => `<div class="st gp">
    <b>${o.n? o.avg.toFixed(2) : '–'}</b>
    <span>${label}</span>
    <em>${o.n? `${o.n}과목 · ${fmt(o.cr)}학점` : hint}</em></div>`;
  // 4.5 만점 → 100점 만점 환산 (환산표 기준: 100점 = 평점×10+60, 4.0 이상은 100점)
  const conv = o => `<div class="st gp cv">
    <b>${o.n? to100(o.avg).toFixed(1) : '–'}<i>/100</i></b>
    <span>GPA 환산 (100점)</span>
    <em>${o.n? `4.3만점 ${to43(o.avg).toFixed(2)} · 4.0만점 ${to40(o.avg).toFixed(2)}` : '100점 = 평점×10+60'}</em></div>`;
  document.getElementById('stats').innerHTML = `
    <div class="st"><b>${fmt(totalCredits())}</b><span>총 취득학점</span></div>
    ${gcard('전체 평균', all, '성적 입력 필요')}
    ${conv(all)}
    ${gcard('전공 평균', maj, '전공필수·전공선택')}
    ${gcard('교양 평균', lib, '교양·학문의기초')}
    <div class="st"><b>${engCount()}</b><span>영강 과목수 (BUSS)</span></div>
    <div class="st"><b>${fmt(dualInfo().used)}</b><span>중복인정 학점</span><em>한도 6학점</em></div>
    <div class="st"><b>${S.courses.length}</b><span>등록 과목수</span></div>`;
}

function renderSems(){
  const el = document.getElementById('sems');
  el.innerHTML = sortedSems().map(s=>{
    const cs = S.courses.filter(c=>c.sem===s);
    const cr = cs.filter(c=>c.gr!=="수강중"&&c.gr!=="F").reduce((a,c)=>a+ +c.cr,0);
    return `<div class="sem">
      <div class="h"><span>${semLabel(s)}${/-(S|W)$/.test(s)?' <em class="ss">계절</em>':''}</span>
        <span class="rt"><span class="m">${fmt(cr)}학점</span>
        <button class="sx" title="학기 삭제" onclick="delSem('${s}')">✕</button></span></div>
      ${cs.length? cs.map(c=>`
        <div class="co" onclick="editCourse('${c.id}')">
          <span class="nm">${c.name}</span>
          ${c.eng?'<span class="bd e">영강</span>':''}
          <span class="bd">${c.cat.replace('융전-','융')}</span>
          <span class="gr">${c.gr}</span>
          <button class="x" onclick="event.stopPropagation();delCourse('${c.id}')">✕</button>
        </div>`).join('') : '<div class="empty">과목 없음</div>'}
      <button class="add" onclick="openAdd('${s}')">+ 추가</button>
    </div>`;
  }).join('');
}

function render(){ renderStats(); renderDash(); renderSems(); save(); }

/* ═══════════ 6. 과목 추가/수정 ═══════════ */
function fillSelects(){
  document.getElementById('fCat').innerHTML = CATS.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('fGr').innerHTML  = Object.keys(GRADES).map(g=>`<option>${g}</option>`).join('');
  document.getElementById('fSem').innerHTML = sortedSems().map(s=>`<option value="${s}">${semLabel(s)}</option>`).join('');
}
function openSearchFor(code){
  openAdd();
  const d = DB.find(x=>x.code===code);
  q.value = code;
  if(d){
    fName.value = d.name;
    fCode.value = d.code;
    fCr.value   = d.cr;
    fEng.value  = d.eng ? '1' : '0';
    if(CATS.includes(d.cat)) fCat.value = d.cat;
  }
  search();
}
function openAdd(sem){
  S.editing=null; fillSelects();
  document.getElementById('dlgTitle').textContent='과목 추가';
  q.value=''; res.innerHTML=''; fName.value=''; fCode.value=''; fCr.value=3;
  fGr.value='A+'; fEng.value='0'; fCat.value='전공선택';
  if(sem) fSem.value=sem;
  dlg.showModal(); q.focus();
}
function editCourse(id){
  const c = S.courses.find(x=>x.id===id); if(!c) return;
  S.editing=id; fillSelects();
  document.getElementById('dlgTitle').textContent='과목 수정';
  q.value=''; res.innerHTML='';
  fName.value=c.name; fCode.value=c.code; fCr.value=c.cr; fCat.value=c.cat;
  fGr.value=c.gr; fSem.value=c.sem; fEng.value=c.eng?'1':'0';
  dlg.showModal();
}
function search(){
  const v = q.value.trim().toLowerCase().replace(/\s/g,'');
  if(!v){ res.innerHTML=''; return; }
  const hit = DB.filter(d=>d.name.toLowerCase().replace(/\s/g,'').includes(v) || d.code.toLowerCase().includes(v)).slice(0,60);
  const row = (d,cat,label=cat) => `
    <div onclick="pick('${d.code}','${cat}')">
      <small>${d.code}</small><span>${d.name}</span>
      <span class="tg">${d.cr}학점</span>
      ${d.eng?'<span class="tg">영강</span>':''}
      <span class="tg">${label}</span>
    </div>`;
  const html = hit.map(d=>{
    if(!d.alt) return row(d,d.cat);
    const isConvElectiveArea = /^융전-[123]영역$/.test(d.alt);
    const convLabel = isConvElectiveArea
      ? d.alt
      : d.alt;
    // 융합전공 전공선택 1·2·3영역 과목은 별도의 '전공선택' 행을 중복 표시하지 않음
    if(isConvElectiveArea && d.cat === '전공선택') return row(d,d.alt,convLabel);
    return row(d,d.cat) + row(d,d.alt,convLabel);
  }).join('');
  res.innerHTML = hit.length? html : '<div style="padding:10px;color:#aaa;font-size:12px">검색 결과 없음 — 아래에 직접 입력하세요</div>';
}
function pick(code,cat){
  const d = DB.find(x=>x.code===code); if(!d) return;
  fName.value = d.name;
  fCode.value = d.code;
  fCr.value   = d.cr;
  fCat.value  = CATS.includes(cat) ? cat : d.cat;
  fEng.value  = d.eng ? '1' : '0';
  res.innerHTML=''; q.value='';
}
function saveCourse(){
  if(!fName.value.trim()){ alert('과목명을 입력하세요'); return; }
  const o = { id:S.editing||('c'+Date.now()+Math.random().toString(36).slice(2,6)),
    name:fName.value.trim(), code:fCode.value.trim().toUpperCase(),
    cat:fCat.value, cr:+fCr.value||0, gr:fGr.value, sem:fSem.value, eng:fEng.value==='1' };
  if(S.editing){ const i=S.courses.findIndex(x=>x.id===S.editing); S.courses[i]=o; }
  else S.courses.push(o);
  dlg.close(); render();
}
function delCourse(id){ S.courses = S.courses.filter(c=>c.id!==id); render(); }
function sortedSems(){ return S.sems.slice().sort((a,b)=>semIdx(a)-semIdx(b)); }
function addSem(){
  const reg = sortedSems().filter(s=>/-(1|2)$/.test(s));
  const last = reg[reg.length-1] || "0-2";
  let [y,t] = last.split('-').map(Number);
  if(t===1) t=2; else { y++; t=1; }
  const nw = y+'-'+t;
  if(!S.sems.includes(nw)) S.sems.push(nw);
  S.sems = sortedSems(); render();
}
/* 계절학기 추가: 버튼을 누르면 학년을 직접 선택 */
let pendingSeasonKind = null;
function openSeason(kind){
  pendingSeasonKind = kind;
  seasonTitle.textContent = kind==='S' ? '여름계절 추가' : '겨울계절 추가';
  seasonYear.value = '1';
  seasonDlg.showModal();
}
function saveSeason(){
  const kind = pendingSeasonKind;
  const y = Number(seasonYear.value);
  if(!kind || ![1,2,3,4].includes(y)) return;
  const nw = y+'-'+kind;
  if(S.sems.includes(nw)){ alert('이미 있는 계절학기입니다'); return; }
  S.sems.push(nw);
  S.sems = sortedSems();
  seasonDlg.close();
  render();
}
/* 학기 삭제 — 계절학기는 자유롭게, 정규학기는 마지막 학기만 삭제 가능.
   과목이 남아 있으면 함께 삭제할지 확인받는다.                     */
function delSem(sem){
  const season = /-(S|W)$/.test(sem);
  if(!season){
    const reg = sortedSems().filter(x=>/-(1|2)$/.test(x));
    if(reg.length<=1){ alert('정규학기는 최소 1개는 남아 있어야 합니다.'); return; }
    if(reg[reg.length-1]!==sem){ alert('정규학기는 마지막 학기부터 삭제할 수 있습니다.\n(삭제하려는 학기: '+semLabel(reg[reg.length-1])+')'); return; }
  }
  const cs = S.courses.filter(c=>c.sem===sem);
  const msg = cs.length
    ? semLabel(sem)+'에 등록된 과목 '+cs.length+'개도 함께 삭제됩니다.\n계속할까요?'
    : semLabel(sem)+'를 삭제할까요?';
  if(!confirm(msg)) return;
  S.courses = S.courses.filter(c=>c.sem!==sem);
  S.sems = S.sems.filter(x=>x!==sem);
  render();
}
function setTab(n){ tab=n; t1.className = n===1?'on':''; t2.className = n===2?'on':''; t3.className = n===3?'on':''; renderDash(); }
function resetAll(){ if(confirm('모든 입력 내용을 지울까요?')){ S.courses=[]; render(); } }
function exportJSON(){
  const b = new Blob([JSON.stringify({sems:S.sems,courses:S.courses},null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download='졸업요건_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
}
function importJSON(inp){
  const f=inp.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=e=>{ try{ const o=JSON.parse(e.target.result); if(o.sems) S.sems=o.sems; S.courses=o.courses||[]; render(); }catch(err){ alert('파일을 읽을 수 없습니다'); } };
  r.readAsText(f); inp.value='';
}
render();
initAuth();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
